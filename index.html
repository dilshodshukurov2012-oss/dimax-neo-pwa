<!DOCTYPE html>
<html lang="ru" class="spl">
<head>
<meta charset="UTF-8">
<style>html.spl,html.spl body{background:#000000}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<!-- v26.53 PWA: цвет #000000 снят программно с углов присланной иконки (все 4 угла = #000000) -->
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DIMAX-NEO">
<meta name="application-name" content="DIMAX-NEO">
<meta name="mobile-web-app-capable" content="yes">
<title>DIMAX-NEO Склад</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#F2F3EE; --surface:#FFFFFF; --surface-2:#E9EBE2; --surface-3:#DFE3D5;
  --ink:#12150F; --ink-2:#525848; --ink-3:#797F6C;
  --line:#D5D8C9; --line-soft:#E4E7DA;
  --accent:#4E9605; --accent-ink:#FFFFFF; --accent-soft:#E7F2D9;
  --steel:#2C4C6B; --steel-soft:#DEE7EF;
  --warn:#A8501F; --warn-soft:#F4E6DC;
  --bad:#95261F; --bad-soft:#F6E3E1;
  --shadow:0 1px 2px rgba(25,28,23,.06), 0 10px 30px -18px rgba(25,28,23,.35);
  --f:"Golos Text","Segoe UI",system-ui,sans-serif;
  --m:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E100D; --surface:#171A14; --surface-2:#20241C; --surface-3:#2A2F25;
    --ink:#E9EBE3; --ink-2:#A3A996; --ink-3:#848B76;
    --line:#2C3126; --line-soft:#22271E;
    --accent:#7BC91A; --accent-ink:#0E100D; --accent-soft:#1D2A12;
    --steel:#8FB6D6; --steel-soft:#1A222A;
    --warn:#E09257; --warn-soft:#2B2018;
    --bad:#E0736A; --bad-soft:#2C1A18;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#0E100D; --surface:#171A14; --surface-2:#20241C; --surface-3:#2A2F25;
  --ink:#E9EBE3; --ink-2:#A3A996; --ink-3:#848B76;
  --line:#2C3126; --line-soft:#22271E;
  --accent:#7BC91A; --accent-ink:#0E100D; --accent-soft:#1D2A12;
  --steel:#8FB6D6; --steel-soft:#1A222A;
  --warn:#E09257; --warn-soft:#2B2018;
  --bad:#E0736A; --bad-soft:#2C1A18;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3,h4{margin:0;letter-spacing:-.015em}

#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--ground);position:relative;padding-bottom:78px}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}

.hd{position:sticky;top:0;z-index:40;background:var(--ground);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
.hd h1{font-size:19px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .sub{font-size:11px;color:var(--ink-3);font-family:var(--m);letter-spacing:.04em;text-transform:uppercase}
.iconbtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn:active{background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink-2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Нижняя навигация — flex с равным распределением вместо жёсткой grid-сетки на 6 колонок:
   число вкладок меняется (4 или 5, в зависимости от прав/hasPoint), а фиксированный
   repeat(6,1fr) оставлял пустую колонку и «съезжал» иконки влево вместо ровного центрирования. */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px -18px rgba(20,22,16,.5);display:flex;max-width:520px;margin:0 auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1 1 0;min-width:0;padding:3px 2px 5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;color:var(--ink-3);font-size:10px;font-weight:600;letter-spacing:-.01em;border-radius:12px;transition:color .15s ease}
.nav button:active{background:var(--surface-2)}
.nav button span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .navic{position:relative;width:40px;height:28px;display:grid;place-items:center;border-radius:10px;transition:background .15s ease}
.nav button.on .navic{background:var(--accent-soft)}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent)}
.nav .badge{position:absolute;top:-2px;right:-3px;background:var(--warn);color:#fff;font-family:var(--m);font-size:9px;font-weight:700;min-width:15px;height:15px;line-height:15px;border-radius:8px;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--surface)}

.pad{padding:14px 16px}
.sec-t{font-size:11px;font-family:var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:22px 16px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-t:first-child{margin-top:14px}
.sec-t a{color:var(--accent);text-decoration:none;font-size:11px;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.list{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-soft);width:100%;text-align:left}
.row:last-child{border-bottom:none}
.row:active{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--ink-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;flex:none}
.row .r .t{font-family:var(--m);font-size:14px}
.chev{width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2;flex:none}

.tile{width:42px;height:42px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;font-family:var(--m)}
.tile.mach{background:var(--steel-soft);color:var(--steel)}
.tile svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* v26.60–61: миниатюры запчастей и техники (itemTile и заглушки с кодом артикула) — 72 px; остальные иконки .tile как были */
.tile.thumb{width:72px;height:72px;border-radius:16px;font-size:18px}
.tile.thumb svg{width:30px;height:30px}
.tile.thumb[data-zoom]{cursor:zoom-in}
/* v26.62: продавцам фото нельзя скачать/скопировать/переслать долгим нажатием (меню браузера отключено) */
html.noimgsave img,html.noimgsave .tile,html.noimgsave #pv{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
/* v26.61: просмотр фото на весь экран (нажатие на фото) */
#pv{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;touch-action:none;opacity:0;transition:opacity .18s ease;overscroll-behavior:contain}
#pv.on{opacity:1}
#pv img{max-width:100vw;max-height:100vh;max-height:100dvh;object-fit:contain;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none;transition:transform .18s ease}
#pv.drag img{transition:none}
#pv .pv-x{position:absolute;z-index:1;top:max(12px,env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;cursor:pointer}
#pv .pv-x svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
#pv .pv-cap{position:absolute;z-index:1;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);bottom:max(16px,env(safe-area-inset-bottom));color:#E9EBE3;font-size:13px;text-align:center;pointer-events:none;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){#pv,#pv img{transition:none}}
/* Тайл с собственной картинкой вместо линейной иконки (логотипы Smart Market/банка/карты на Главной) —
   по прямому решению Владельца, картинка внутри того же цветного квадратика, что и раньше у иконок. */
.tile-img{overflow:hidden}
.tile-img img{width:27px;height:27px;object-fit:contain;display:block}
/* В тёмной теме под картинкой — светлая подложка вместо цветного акцента, чтобы логотип с тёмными/
   цветными деталями (например банк или карта) не терялся на тёмно-зелёном фоне (см. AskUserQuestion). */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile-img{background:#fff}}
:root[data-theme="dark"] .tile-img{background:#fff}
/* Маленький логотип способа оплаты рядом с заголовком раздела (напр. в «Бланках») — та же логика
   со светлой подложкой в тёмной теме, что и у .tile-img, но компактнее. */
.sec-logo{width:15px;height:15px;object-fit:contain;border-radius:4px;flex:none;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec-logo{background:#fff}}
:root[data-theme="dark"] .sec-logo{background:#fff}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.stat .k{font-size:10.5px;font-family:var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:var(--m);font-size:20px;font-weight:600;margin-top:5px;letter-spacing:-.02em}
.stat .v small{font-size:12px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.stat .d{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.stat.wide{grid-column:1/-1}
/* Если в блоке .stats нечётное число плиток (напр. у Владельца на Главной — 5: сегодня/месяц/
   прибыль/техника/долги), последняя оставалась одна в своём ряду и занимала только левую
   колонку, оставляя пустое место справа. Растягиваем такую "висящую" последнюю плитку на всю
   ширину — без ручной расстановки классов, работает для любого будущего набора плиток. */
.stats>*:last-child:nth-child(odd){grid-column:1/-1}

.chart{display:flex;align-items:flex-end;gap:3px;height:72px;padding:0 16px;margin-top:10px}
.chart div{flex:1;background:var(--accent-soft);border-radius:2px 2px 0 0;min-height:2px}
.chart div.hi{background:var(--accent)}

.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--m);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:20px;background:var(--surface-2);color:var(--ink-3)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.st{background:var(--steel-soft);color:var(--steel)}

.fld{padding:0 16px;margin-bottom:12px}
.fld label{display:block;font-size:11px;font-family:var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:15px;outline:none}
.inp:focus{border-color:var(--accent)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
.num{font-family:var(--m);font-variant-numeric:tabular-nums}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent);color:var(--accent-ink);border-radius:11px;padding:14px;font-weight:600;font-size:15px}
.btn:active{opacity:.85}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:10px;font-size:13.5px;border-radius:9px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn[disabled]{opacity:.4}
.btns{display:flex;gap:8px;padding:0 16px}

.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;margin:0 16px 12px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--ink-3)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
/* Компактный вариант .seg — для переключателей язык/тема на «Ещё» (см. screenMore): не тянется
   на всю ширину, кнопки квадратные, с иконкой вместо длинного текста. */
.seg-sm{display:inline-flex;margin:0;width:auto}
.seg-sm button{flex:none;width:34px;height:30px;padding:0;display:grid;place-items:center}
.seg-sm svg{width:16px;height:16px;stroke-width:1.8}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:6px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chips.sub button.on{background:var(--surface-3);border-color:var(--line);color:var(--ink)}

.empty{text-align:center;padding:46px 30px;color:var(--ink-3);font-size:14px}
.empty svg{width:34px;height:34px;stroke:var(--ink-3);fill:none;stroke-width:1.3;opacity:.5;margin-bottom:10px}

.scrim{position:fixed;inset:0;background:rgba(10,12,9,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(22px)}}
.sheet{background:var(--ground);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;animation:up .2s ease;padding-bottom:22px}
.sheet-hd{position:sticky;top:0;background:var(--ground);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:5}
.sheet-hd h3{flex:1;font-size:17px;font-weight:700;min-width:0}
.grab{width:34px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}

.cart-bar{position:fixed;bottom:78px;left:0;right:0;max-width:520px;margin:0 auto;padding:0 12px;z-index:45}
.cart-bar .in{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px -8px rgba(0,0,0,.4);width:100%}
.cart-bar .in .c{font-family:var(--m);font-size:13px;opacity:.85}
.cart-bar .in .s{flex:1;font-family:var(--m);font-size:17px;font-weight:600;text-align:left}

.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.qty button{width:34px;height:34px;display:grid;place-items:center;font-size:17px;color:var(--ink-2);background:var(--surface)}
.qty input{width:44px;height:34px;text-align:center;border:none;background:var(--surface);font-family:var(--m);font-size:14px;outline:none}

table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
table.tb th{font-family:var(--m);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 10px;background:var(--surface-2);white-space:nowrap}
table.tb td{padding:9px 10px;border-bottom:1px solid var(--line-soft)}
table.tb td.n{font-family:var(--m);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:var(--surface);margin:0 16px}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:22px;font-size:13.5px;z-index:200;box-shadow:var(--shadow);max-width:90%;text-align:center}

.savefail-bar{position:fixed;top:0;left:0;right:0;z-index:300;background:var(--bad);color:#fff;padding:10px 14px;font-size:12.5px;line-height:1.4;box-shadow:var(--shadow)}
.savefail-bar .btns{display:flex;gap:8px;margin-top:8px}
.savefail-bar button{flex:1;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:600;cursor:pointer}

.receipt{font-family:var(--m);font-size:12.5px;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:16px;margin:0 16px;white-space:pre-wrap}

.login{padding:60px 22px 30px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.login .logo{width:56px;height:56px;border-radius:15px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-bottom:20px}
.login .logo svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.6}
.login h1{font-size:29px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
.login p{color:var(--ink-3);font-size:14px;margin:0 0 26px}
.ucard{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;width:100%;text-align:left}
.ucard:active{border-color:var(--accent)}
.ucard .grow{flex:1}
.ucard .t{font-weight:600;font-size:15px}
.ucard .s{font-size:12.5px;color:var(--ink-3)}

.wm span{color:var(--accent)}
h1.wm{font-size:18.5px}
.brand-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin:0 16px}
.brand-card .wm{font-size:21px}
.tg{font-family:var(--m);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}

.login{background:#0E100D;color:#E9EBE3;min-height:100vh;padding:56px 22px 34px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.login>*{position:relative;z-index:2}
.login::before{content:"";position:absolute;z-index:1;right:-45%;top:-18%;width:120%;height:78%;background:radial-gradient(circle at 62% 42%,rgba(123,201,26,.20),transparent 62%)}
.login::after{content:"";position:absolute;z-index:1;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#4E9605,#7BC91A 45%,#A9E04B)}
.login .wm{font-size:37px;color:#fff;margin-top:16px}
.login .tg{font-size:10px;letter-spacing:.26em;color:#8B9280;margin-top:9px}
.login .slogan{font-size:19px;font-weight:700;line-height:1.18;text-transform:uppercase;margin:28px 0 30px;max-width:15ch}
.login .slogan b{color:#7BC91A;font-weight:700}
.login .pickline{color:#8B9280;font-size:13px;margin:0 0 12px}
.login .ucard{background:#171A14;border-color:#2A2F25}
.login .ucard .t{color:#E9EBE3}
.login .ucard .s{color:#8B9280}
.login .ucard:active{border-color:#7BC91A}
.login .tile{background:rgba(123,201,26,.13);color:#7BC91A}
.login .chev{stroke:#5E6553}
.login .demo-note{text-align:center;color:#5E6553;font-size:11px;font-family:var(--m);margin-top:20px}

/* Стартовый экран (2026-09): мягкое появление логотипа/слогана при загрузке — ничего резкого,
   просто лёгкий fade+float-in, чтобы экран не выглядел статично. */
@keyframes startFadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.start-anim>*{animation:startFadeIn .6s ease-out both}
/* v26.43→44: логотип/надпись/слоган теперь внутри обёртки .start-main — сама обёртка не анимируется,
   поочерёдно появляются её дети (та же последовательность задержек, что и раньше). */
.start-anim>.start-main{animation:none}
.start-anim>.start-main>*{animation:startFadeIn .6s ease-out both}
.start-anim>.start-main>.brand-mark-d{animation-delay:.02s}
.start-anim>.start-main>.wm{animation-delay:.10s}
.start-anim>.start-main>.tg{animation-delay:.18s}
.start-anim>.start-main>.slogan{animation-delay:.26s}
.start-anim>.btns{animation-delay:.36s}
@media (prefers-reduced-motion: reduce){.start-anim>*,.start-anim>.start-main>*{animation:none}}

/* Стартовый экран (v26.44) — всё ниже относится ТОЛЬКО к screenStart() (класс .start-screen),
   общие .login/.bm-big/.slogan/.wm/.tg и langSwitcher() для других экранов не меняются.
   Структура: язык RU/UZ прижат к правому верхнему углу (вне потока), группа логотип+надпись+слоган
   центрируется в оставшемся месте (.start-main, flex:1), кнопка «Вход» прижата к низу экрана. */
/* у #app есть padding-bottom:78px под нижнюю навигацию — на стартовом экране навигации нет, и этот
   отступ давал 78px пустой прокрутки под прижатой к низу кнопкой «Вход»; убираем его только здесь */
#app:has(>.start-screen){padding-bottom:0}
.login.start-screen{justify-content:flex-start;min-height:100vh;min-height:100dvh;padding:calc(60px + env(safe-area-inset-top)) 22px 0}
.start-screen>.start-lang{position:absolute;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));z-index:5}
.start-screen>.start-main{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;padding-bottom:20px}
/* v26.45 (по просьбе Владельца): логотип и слоган — крупно и по центру; DIMAX-NEO и подпись остаются слева.
   Логотип ≈60% ширины экрана (не больше 300px — #app ограничен 520px), пропорции 104:74 держит aspect-ratio.
   Слоган — ровно 2 строки (nowrap внутри строки), размер шрифта считается от ширины экрана так, чтобы
   самая длинная строка «НАДЁЖНАЯ ТЕХНИКА —» влезала даже на 320px. */
.start-screen .bm-xl{width:clamp(150px,60vw,300px);height:auto;aspect-ratio:104/74;align-self:center}
/* v26.47 (по просьбе Владельца): на стартовом экране — новый логотип, присланный Владельцем

   1280×1013 (область 788×561, пропорции 104:74 как у прежнего), чёрный фон превращён в прозрачность.

/* ---------- печатный бланк A4 ---------- */
#printroot{display:none}
.a4{background:#fff;color:#111;padding:22px;border-radius:12px;border:1px solid var(--line);margin:0 16px;font-size:12.5px;line-height:1.5}
.a4 .hd4{display:flex;align-items:center;gap:15px;margin-bottom:0}
.a4 .hd4 .mk{width:58px;height:41px;background-size:contain;background-repeat:no-repeat;flex:none}
.a4 .nm{font-weight:800;font-size:25px;letter-spacing:-.035em;color:#111;line-height:1}
.a4 .nm i{color:#4E9605;font-style:normal}
.a4 .co{margin-left:auto;text-align:right;font-family:var(--m);font-size:9.5px;line-height:1.65;color:#7a7f72;letter-spacing:.02em;white-space:nowrap}
.a4 .co b{color:#222;font-weight:500;font-size:10.5px}
.a4 .rule{display:flex;align-items:center;margin:12px 0 18px}
.a4 .rule i{display:block;height:4px;width:78px;background:linear-gradient(90deg,#2F6B3A,#7BC91A);border-radius:2px;flex:none}
.a4 .rule u{display:block;flex:1;height:1px;background:#DFE3D8;text-decoration:none}
.a4 h4{font-size:15px;margin:0 0 3px;text-align:center;text-transform:uppercase}
.a4 .sub4{text-align:center;font-size:11px;color:#666;margin-bottom:14px}
.a4 .parties{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.a4 .parties b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#777;margin-bottom:3px}
.a4 table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:12px}
.a4 th{background:#F0F4EA;text-align:left;padding:6px 7px;font-size:10px;text-transform:uppercase;color:#555;border:1px solid #DDE3D4}
.a4 td{padding:6px 7px;border:1px solid #E3E7DC}
.a4 td.r{text-align:right;white-space:nowrap}
.a4 .tot{text-align:right;font-size:14px;font-weight:700;margin-bottom:14px}
.a4 .terms{font-size:11px;color:#444;white-space:pre-wrap;margin-bottom:8px}
.a4 .itc{display:flex;gap:12px;border:1px solid #E3E7DC;border-radius:8px;padding:10px;margin-bottom:10px;page-break-inside:avoid}
.a4 .itc img{width:130px;height:96px;object-fit:cover;border-radius:6px;border:1px solid #E3E7DC;flex:none;background:#F5F7F2}
.a4 .itc .nm2{font-weight:700;font-size:12.5px;margin-bottom:2px}
.a4 .itc .ar{font-family:var(--m);font-size:10px;color:#888;margin-bottom:4px}
.a4 .itc .ds{font-size:10.8px;color:#444;white-space:pre-wrap;margin-bottom:5px;line-height:1.45}
.a4 .itc .sp{font-size:10.5px;color:#333;display:grid;grid-template-columns:auto 1fr;gap:1px 10px}
.a4 .itc .sp b{font-weight:500;color:#777}
.a4 .sg{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px;font-size:11px;position:relative}
.a4 .sg .ln{border-top:1px solid #999;margin-top:44px;padding-top:4px;color:#666}
.a4 .ovl{position:absolute;left:0;top:-4px;pointer-events:none}
.a4 .ovl img{max-height:58px;display:inline-block;vertical-align:top}
.a4 .ovl img.st{max-height:96px;margin-left:26px;opacity:.85}
.a4.dkp{font-size:11px;line-height:1.45;text-align:justify}
.a4.dkp h4{font-size:16px;margin-top:6px}
.a4 .pre{margin:10px 0 14px;text-indent:14px}
.a4 .cl{margin-bottom:9px}
.a4 .cl h5{font-size:11.5px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.03em;color:#1b1b1b;border-bottom:1px solid #E3E7DC;padding-bottom:2px}
.a4 .cl p{margin:0 0 3px;text-indent:0}
.a4 table.pt{margin:10px 0 14px}
.a4 table.pt th{width:50%;text-align:center}
.a4 table.pt td{vertical-align:top;font-size:10.5px;line-height:1.5}
.a4 table.sgt td{height:66px;position:relative}
.a4 .sl{margin-top:40px;margin-bottom:2px}
.a4 table.spec th{font-size:9.5px;line-height:1.25;text-align:center}
.a4 table.spec td{font-size:10.5px}
.a4 table.spec .tr-tot td{font-weight:700;background:#F0F4EA;text-align:right}
.a4 table.spec .tr-vat td{background:#F7F9F4;text-align:right;color:#555}
.a4 .brk{height:0;border-top:1px dashed #bbb;margin:22px 0 14px}
@media print{
  .a4 .brk{page-break-before:always;display:block}
  .a4 .cl{page-break-inside:avoid}
  .a4 table.pt{page-break-inside:avoid}
  #app{display:none!important}
  #printroot{display:block!important}
  .a4{margin:0;border:none;border-radius:0;padding:0;font-size:12px}
  @page{size:A4;margin:14mm}
}

/* v26.58: экран загрузки — продолжение системного сплэша Chrome: тот же фон (#000000 = background_color манифеста),
   та же иконка icon-512 со скруглением 22%, под ней слоган RU/UZ. Манифест и файлы иконок не меняются. */
#splash{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;z-index:10000;background:#000000;
  display:flex;flex-direction:column;justify-content:center;align-items:center;box-sizing:border-box;padding:0 16px;
  opacity:1;transition:opacity .3s cubic-bezier(.4,0,.2,1)}
#splash.hide{opacity:0;pointer-events:none}
#splash .spl-icon{--s:clamp(96px,22vw,160px);width:var(--s);height:var(--s);border-radius:calc(var(--s) * .22);
  display:block;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#splash .spl-tag{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;max-width:100%;
  font-family:var(--f);font-size:13px;line-height:1.25;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#B8C4B0}
#splash .spl-dots{margin-top:22px;display:flex;gap:7px;opacity:0;animation:splshow .2s ease 2.5s forwards}
#splash .spl-dots i{width:6px;height:6px;border-radius:50%;background:#B8C4B0;opacity:.4;animation:splpulse 1.2s ease-in-out infinite}
#splash .spl-dots i:nth-child(2){animation-delay:.2s} #splash .spl-dots i:nth-child(3){animation-delay:.4s}
@keyframes splpulse{0%,100%{opacity:.4}50%{opacity:.8}}
@keyframes splshow{to{opacity:1}}
@media (prefers-reduced-motion:reduce){#splash{transition:none}#splash .spl-dots{animation:splshow 0s linear 2.5s forwards}#splash .spl-dots i{animation:none;opacity:.6}}
</style>

// загружены. Уход — 300 мс (opacity), при prefers-reduced-motion — без анимации. Не меньше 0.4 с, чтобы не моргал;
// страховка — не дольше 15 с.
window.__splT0=Date.now();
window.hideSplash=function(){ var el=document.getElementById('splash'); if(!el||el.__hiding) return; el.__hiding=1;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var done=function(){ if(el.parentNode) el.parentNode.removeChild(el); document.documentElement.classList.remove('spl'); };
  setTimeout(function(){ if(reduce){ done(); return; } el.classList.add('hide'); setTimeout(done,340); },
    Math.max(0,400-(Date.now()-window.__splT0))); };
setTimeout(window.hideSplash,15000);
</script>

 sellerTermsText:"1. Продавец не приобретает товар в собственность и не вкладывает собственные средства. Компания предоставляет продавцу специальную (дилерскую) цену на товар для его дальнейшей реализации — клиентам компании или клиентам, найденным продавцом самостоятельно.\n\n2. Доходом продавца является разница между специальной ценой Компании и суммой, фактически полученной от клиента. Это вознаграждение считается заработанным и переходит в распоряжение продавца только с момента фактического поступления денежных средств Владельцу Компании (наличными на руки, на расчётный счёт либо на карту). До этого момента вся сумма, вырученная от продажи, включая часть, приходящуюся на вознаграждение продавца, считается денежными средствами Компании во временном ведении продавца (ст. 839 ГК Республики Узбекистан).\n\n3. С момента передачи товара продавцу и до момента поступления денег Владельцу продавец несёт полную ответственность за сохранность товара и за сохранность и своевременную передачу Владельцу вырученных денежных средств. Непереданные в срок деньги либо утраченный/непереданный товар считаются задолженностью продавца перед Компанией (ст. 832, 840 ГК Республики Узбекистан).\n\n4. Настоящие условия являются внутренним регламентом Компании и не заменяют законодательство Республики Узбекистан; отношения сторон в части реализации товара за счёт Компании по существу соответствуют главе 48 «Комиссия» Гражданского кодекса Республики Узбекистан (ст. 832, 839, 840).\n\n5. Продавец подтверждает согласие с условиями отметкой в чекбоксе; без согласия кабинет не активируется.",

 sellerTermsTitle:"Sotuvchining DIMAX-NEO bilan hamkorlik shartlari",
 sellerTermsText:"1. Sotuvchi tovarni mulk sifatida sotib olmaydi va o'z mablag'ini kiritmaydi. Kompaniya sotuvchiga tovar uchun keyingi sotish — kompaniya mijozlariga yoki sotuvchi mustaqil topgan mijozlarga sotish — uchun maxsus (diler) narxni taqdim etadi.\n\n2. Sotuvchining daromadi Kompaniyaning maxsus narxi va mijozdan haqiqatda olingan summa o'rtasidagi farqdan iborat. Bu mukofot faqat pul mablag'lari Kompaniya Egasiga (naqd qo'lga, hisob-kitob hisobiga yoki kartaga) haqiqatda kelib tushgan paytdan boshlab ishlab topilgan hisoblanadi va sotuvchi ixtiyoriga o'tadi. Shu vaqtga qadar sotishdan tushgan butun summa, shu jumladan sotuvchi mukofotiga to'g'ri keladigan qismi ham, Kompaniyaning sotuvchi vaqtincha boshqaruvidagi pul mablag'lari hisoblanadi (O'zbekiston Respublikasi Fuqarolik kodeksining 839-moddasi).\n\n3. Tovar sotuvchiga topshirilgan paytdan boshlab va pul Egasiga kelib tushgunga qadar sotuvchi tovarning saqlanishi, shuningdek sotishdan tushgan pul mablag'larining saqlanishi va Egasiga o'z vaqtida topshirilishi uchun to'liq javobgar bo'ladi. O'z vaqtida topshirilmagan pul yoki yo'qolgan/topshirilmagan tovar sotuvchining Kompaniya oldidagi qarzi hisoblanadi (O'zbekiston Respublikasi Fuqarolik kodeksining 832- va 840-moddalari).\n\n4. Mazkur shartlar Kompaniyaning ichki tartibi hisoblanadi va O'zbekiston Respublikasi qonunchiligini almashtirmaydi; tomonlarning tovarni Kompaniya hisobidan sotish qismidagi munosabatlari mohiyatan O'zbekiston Respublikasi Fuqarolik kodeksining 48-bobi «Komissiya»siga (832-, 839-, 840-moddalar) mos keladi.\n\n5. Sotuvchi shartlarga roziligini katakchani belgilash orqali tasdiqlaydi; rozilik bildirilmaguncha kabinet faollashtirilmaydi.",

function finishLoad(){
  if(!DB.pendings) DB.pendings=[];
  if(!DB.docs) DB.docs=[];
  if(!DB.firms) DB.firms=[];
  if(!DB.purchases) DB.purchases=[];
  if(!DB.writeoffs) DB.writeoffs=[];
  if(!DB.invAlerts) DB.invAlerts=[];
  if(!DB.remits) DB.remits=[];
  if(!DB.staffDebts) DB.staffDebts=[];
  if(!DB.inventories) DB.inventories=[];
  if(!DB.partAlerts) DB.partAlerts=[];
  // ===== Партионный учёт себестоимости запчастей (FIFO), Этап 0 (2026-09) =====
  // Разовый бэкафилл: до этого момента себестоимость запчасти была одним числом на карточке
  // товара (DB.products[i].cost), которое каждый приход просто перезаписывал последней ценой
  // закупки. С этого момента источником истины становится DB.stockLots — список партий с
  // остатком (qtyLeft), из которых при продаже списывается по принципу FIFO (Этап 1).
  // Реальных исторических данных пока мало (в основном тестовые), поэтому НЕ восстанавливаем
  // детальную историю прошлых приходов — просто фиксируем то, что есть на складе СЕЙЧАС, одной
  // "открывающей" партией на товар/склад по текущей известной себестоимости. Дальше партии
  // накапливаются уже честно, по мере новых приходов. Техники (DB.units) это не касается —
  // там себестоимость уже и так хранится поштучно на каждой единице, партии ей не нужны.
  if(!DB.stockLots){
    DB.stockLots=[];
    const usdRateForBackfill=DB.settings.usdRate||12650;
    DB.products.forEach(pr=>{
      DB.warehouses.forEach(w=>{
        const q=stockOf(pr.id,w.id);
        if(q>0){
          const unitCostUZS=pr.cur==='USD'?Math.round((pr.cost||0)*usdRateForBackfill):Math.round(pr.cost||0);
          DB.stockLots.push({id:uid('lot'),pid:pr.id,whId:w.id,qty:q,qtyLeft:q,
            unitCost:unitCostUZS,purchaseId:null,at:Date.now(),source:'opening'});
        }
      });
    });
  }
  // Досоздание демо-филиалов/складов — миграция только для старых баз; в чистой установке
  // (DB.cleanSeed, v26.43) Владелец заводит филиалы сам, поэтому их не возвращаем.
  if(!DB.cleanSeed){
    if(!DB.branches.find(b=>b.id==='b3')) DB.branches.push({id:'b3',name:'Ургенч'});
    if(!DB.branches.find(b=>b.id==='b4')) DB.branches.push({id:'b4',name:'Сурхондарё'});
    if(!DB.branches.find(b=>b.id==='b5')) DB.branches.push({id:'b5',name:'Жомбой'});
    if(!DB.branches.find(b=>b.id==='b6')) DB.branches.push({id:'b6',name:'Пайшанба'});
  }
  if(!DB.warehouses.find(w=>w.id==='w2')) DB.warehouses.push({id:'w2',name:'DIMAX-NEO склад',nameUz:'DIMAX-NEO ombori',branchId:'b1'});
  if(!DB.cleanSeed){
    if(!DB.warehouses.find(w=>w.id==='w4')) DB.warehouses.push({id:'w4',name:'Ургенч',nameUz:'Urganch',branchId:'b3'});
    if(!DB.warehouses.find(w=>w.id==='w5')) DB.warehouses.push({id:'w5',name:'Сурхондарё',nameUz:'Surxondaryo',branchId:'b4'});
    DB.products.forEach(p=>{ ['w2','w4','w5'].forEach(wid=>{ const k=p.id+'_'+wid; if(DB.stock[k]===undefined) DB.stock[k]=0; }); });
  }
  // У Ахмаджона (Пайшанба, онлайн-продавец без своей точки) раньше ошибочно завели отдельный склад
  // w6 со своим остатком — по решению Владельца убираем его: весь остаток запчастей и вся техника,
  // что успели попасть на w6, переносятся на головной склад DIMAX-NEO (w2), а сам склад удаляется.
  // Разовая миграция для уже накопленных данных — в новых базах w6 больше не создаётся вовсе.
  if(DB.warehouses.find(w=>w.id==='w6')){
    Object.keys(DB.stock).forEach(k=>{
      if(k.slice(-3)==='_w6'){
        const pid=k.slice(0,-3);
        DB.stock[pid+'_w2']=(DB.stock[pid+'_w2']||0)+(DB.stock[k]||0);
        delete DB.stock[k];
      }
    });
    DB.units.forEach(u=>{ if(u.whId==='w6') u.whId='w2'; });
    DB.moves.forEach(m=>{ if(m.whId==='w6') m.whId='w2'; if(m.whId2==='w6') m.whId2='w2'; });
    // Перемещение "DIMAX-NEO → Пайшанба" после переноса превращается в самому себе (w2→w2) —
    // такая запись в истории ничего не значит и только путает, поэтому убираем её вовсе.
    DB.moves=DB.moves.filter(m=>!(m.type==='transfer'&&m.whId==='w2'&&m.whId2==='w2'));
    DB.warehouses=DB.warehouses.filter(w=>w.id!=='w6');
  }
  const u5whFix=DB.users.find(u=>u.id==='u5'); if(u5whFix&&u5whFix.whId==='w6') u5whFix.whId='w2';
  // старый общий филиал "Жомбой/DIMAX-NEO склад" (b1) разделён: у Кахрамона и Ахмаджона теперь свои филиалы и склады
  const w1old=DB.warehouses.find(w=>w.id==='w1');
  if(w1old && w1old.branchId==='b1') w1old.branchId='b5';
  const u4old=DB.users.find(u=>u.id==='u4'); if(u4old && u4old.branchId==='b1'){ u4old.branchId='b5'; }
  const u5old=DB.users.find(u=>u.id==='u5'); if(u5old && u5old.branchId==='b1'){ u5old.branchId='b6'; u5old.whId='w2'; u5old.hasPoint=false; }
  // Ахмаджон — онлайн-продавец без своей точки, видит и продаёт со всех складов
  const u5cur=DB.users.find(u=>u.id==='u5'); if(u5cur && u5cur.hasPoint===true){ u5cur.hasPoint=false; }
  const u1old=DB.users.find(u=>u.id==='u1'); if(u1old && u1old.whId==='w1'){ u1old.whId='w2'; }
  // Раньше здесь принудительно ДОСОЗДАВАЛИСЬ демо-менеджеры (u4–u7), если их не было в базе —
  // это было нужно, пока они жили только в seed(). Теперь единственный способ появления нового
  // сотрудника — регистрация (см. выше), поэтому эту принудительную пересоздачу убрали: на уже
  // существующих устройствах, где эти записи реально сохранены, их наличие/поля не меняются.
  DB.users = DB.users.filter(u=>u.id!=='u2'&&u.id!=='u3');
  DB.users.forEach(u=>{ if(u.hasPoint===undefined) u.hasPoint=true; });
  // «Только онлайн» раньше только прятал вкладку «Склад», но не переносил продавца на общий склад —
  // он продолжал списывать товар со своего старого физического склада. По решению Владельца (2026-09)
  // online-only продавец должен работать со склада DIMAX-NEO (w2). Одноразово чиним уже переключённые
  // учётные записи; сам переключатель (см. data-act="togglePoint") теперь делает перенос сразу.
  DB.users.forEach(u=>{
    if(u.role!=='admin'&&u.hasPoint===false&&u.whId!=='w2'){
      if(u.priorWhId===undefined) u.priorWhId=u.whId;
      u.whId='w2';
    }
  });
  // Обязательная анкета продавца (2026-09) — распространяется и на уже существующих продавцов,
  // созданных до появления этой функции (включая тех, кто раньше проходил через старую
  // регистрацию по логину/паролю без анкеты), а не только на новых.
  DB.users.forEach(u=>{ if(u.role==='manager'&&u.profileComplete===undefined) u.profileComplete=false; });
  // исторические записи авторов, которых больше нет (u2/u3, до разделения филиала) — переносим на админа,
  // иначе они "теряются" для фильтров по владельцу (менеджеры видят только свои записи)
  [DB.sales,DB.expenses,DB.payments,DB.remits,DB.pendings].forEach(arr=>{
    (arr||[]).forEach(r=>{ if(r.userId==='u2'||r.userId==='u3') r.userId='u1'; });
  });
  // старые записи с branchId:'b1' могли реально принадлежать Кахрамону/Ахмаджону до разделения общего
  // филиала — уточняем по фактическому автору записи (его актуальный филиал после реассайна выше)
  [DB.sales,DB.expenses,DB.payments,DB.remits].forEach(arr=>{
    (arr||[]).forEach(r=>{ if(r.branchId==='b1'&&r.userId){ const u=DB.users.find(x=>x.id===r.userId); if(u&&u.branchId&&u.branchId!=='b1') r.branchId=u.branchId; } });
  });
  DB.clients.forEach(c=>{ if(c.userId===undefined) c.userId='u1'; });
  (DB.pendings||[]).forEach(p=>{ if(p.userId===undefined){ const s=DB.sales.find(x=>x.id===p.saleId); p.userId=s?s.userId:'u1'; } });
  if(!DB.settings.docSeq) DB.settings.docSeq={};
  if(DB.settings.vatOn===undefined) DB.settings.vatOn=true;

  if(DB.settings.marketRateSrc===undefined) DB.settings.marketRateSrc=null;

function compressProductPhoto(file){

    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ URL.revokeObjectURL(url);
      const big=Math.max(im.naturalWidth,im.naturalHeight);
      if(big<=PHOTO_MAX&&/^image\/(jpeg|png|webp)$/.test(file.type)){ resolve(file); return; } // маленькое — не трогаем
      const k=Math.min(1,PHOTO_MAX/big), c=document.createElement('canvas');
      c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      c.toBlob(b=>b?resolve(b):reject(new Error('jpeg')),'image/jpeg',PHOTO_Q); };
    im.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error(t('xlsxBadFile'))); };
    im.src=url; });
}

// ===== Партионный учёт себестоимости запчастей (FIFO), Этап 1 (2026-09) =====
// costOfParts — средневзвешенная себестоимость ОСТАВШИХСЯ партий товара (по всем складам сразу,
// как и раньше был единый p.cost на всю компанию). Возвращает null, если партий с остатком нет
// вообще (например, товар распродан подчистую) — тогда costOf() ниже подстраховывается кэшем p.cost.
function costOfParts(pid){
  const lots=(DB.stockLots||[]).filter(l=>l.pid===pid&&l.qtyLeft>0);
  const totalQty=lots.reduce((a,l)=>a+l.qtyLeft,0);
  if(!totalQty) return null;
  return lots.reduce((a,l)=>a+l.qtyLeft*l.unitCost,0)/totalQty;
}
// costOf() для техники не изменился (себестоимость единицы, как и раньше, фиксируется в момент
// прихода на самом DB.units[i] — партии ей не нужны, там уже точнее чем FIFO, поштучно).
// Для запчастей источник истины теперь DB.stockLots, а не хранимое число — p.cost остаётся только
// как кэш для отображения и как аварийный fallback, если по товару вдруг не осталось ни одной партии.
const costOf=p=>{
  if(p.kind==='part'){
    const avg=costOfParts(p.id);
    if(avg!==null) return Math.round(avg);
  }

};

// Списывает qty штук товара pid со склада whId со старейших партий (FIFO). Если партий не хватило —
// НЕ блокирует (по решению Владельца, 2026-09): недостачу списывает по последней известной средней
// себестоимости и помечает shortfall>0, чтобы вызывающий код мог выставить флаг needsReview на продажу.
function consumeLotsFIFO(pid, whId, qty){
  const lots=(DB.stockLots||[]).filter(l=>l.pid===pid&&l.whId===whId&&l.qtyLeft>0).sort((a,b)=>a.at-b.at);
  let need=qty, totalCost=0; const used=[];
  for(const lot of lots){
    if(need<=0) break;
    const take=Math.min(lot.qtyLeft, need);
    lot.qtyLeft-=take; totalCost+=take*lot.unitCost; need-=take;
    used.push({lotId:lot.id, qty:take, unitCost:lot.unitCost});
  }
  let shortfall=0;
  if(need>0){
    const pr=prod(pid);
    const fallbackCost=pr?costOf(pr):0; // partий этого товара уже нет (qtyLeft=0 везде) — берём кэш
    totalCost+=need*fallbackCost;
    used.push({lotId:null, qty:need, unitCost:fallbackCost});
    shortfall=need;
  }
  return {lots:used, unitCost: qty>0?totalCost/qty:0, shortfall};
}
// Партионный учёт, Этап 2 (2026-09): перемещение между складами должно переносить СЕБЕСТОИМОСТЬ
// конкретных партий, а не только цифру в DB.stock — иначе средняя себестоимость на складе-приёмнике
// исказится (потеряется история, из какого прихода реально приехал товар). Списываем с fromWh по
// FIFO (как при продаже/списании) и тут же заводим на toWh новые партии с ТЕМИ ЖЕ unitCost.
function transferLotsFIFO(pid, fromWh, toWh, qty){
  const cons=consumeLotsFIFO(pid, fromWh, qty);
  cons.lots.forEach(l=>{
    DB.stockLots=DB.stockLots||[];
    DB.stockLots.push({id:uid('lot'), pid, whId:toWh, qty:l.qty, qtyLeft:l.qty, unitCost:l.unitCost,
      purchaseId:null, at:Date.now(), source:'transfer'});
  });
  return cons;
}
// Цена продажи при приходе (2026-09, по прямому решению Владельца): раньше пересчитывалась
// молча по формуле "перенести % наценки на новую себестоимость" — теперь это только ПОДСКАЗКА
// в форме прихода, а фактическую цену продажи владелец вводит/подтверждает сам по каждой позиции
// (см. sheetPurchase/commitPurchase). purSellHint не трогает DB — чистая функция для отображения.
function purSellHint(i){
  const o=i.kind==='machine'?modl(i.pid):prod(i.pid);
  if(!o) return 0;
  const prevCostUZS=costOf(o), curPriceUZS=priceOf(o);
  const unitLandedUZS=+i.price||0;
  if(unitLandedUZS>prevCostUZS && prevCostUZS>0){
    return roundToThousand(unitLandedUZS*(curPriceUZS/prevCostUZS));
  }
  return curPriceUZS;
}

    im.onload=()=>{ const mx=760, k=Math.min(1,mx/Math.max(im.width,im.height));
      const c=document.createElement('canvas'); c.width=(im.width*k)|0; c.height=(im.height*k)|0;
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.62)); };
    im.src=fr.result; };
  fr.readAsDataURL(file);
}

let TOAST_QUEUE=[];
function toast(m){
  // Если тост уже показан — новый не затирает его молча, а встаёт в очередь и покажется
  // сразу после текущего. Раньше два toast(), вызванных подряд синхронно (например, сначала
  // предупреждение об ошибке, затем сообщение об успехе), приводили к тому, что пользователь
  // видел только последний — первый пропадал, даже не отрисовавшись ни разу.
  if(TOAST){ TOAST_QUEUE.push(m); return; }
  TOAST=m; render();
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>{
    TOAST=null;
    if(TOAST_QUEUE.length){ toast(TOAST_QUEUE.shift()); } else { render(); }
  },2200);
}

/* ============ ops ============ */
function addMove(o){DB.moves.unshift(Object.assign({id:uid('mv'),at:Date.now(),userId:ME.id},o));}
// Знак движения ("+"/"−") в истории должен считаться с точки зрения ТЕКУЩЕГО пользователя, а не
// склада-источника перемещения: если наш склад — источник (мы отдали товар), это "−", даже если сам
// тип движения 'transfer' (который по умолчанию считался "+"). Для Владельца (видит все склады сразу)
// перемещение — нейтральное событие по компании в целом, поэтому знак для него всегда "+".
// Списание (writeoff) — это всегда потеря товара/техники, поэтому знак всегда "−", а не "+", как
// было раньше по умолчанию для любого типа движения, кроме продажи.
const moveSign=m=>{
  if(m.type==='out'||m.type==='writeoff') return '−';
  if(m.type==='transfer'&&m.whId2&&!can('allBranches')){
    const mine=visibleWh().map(w=>w.id);
    if(mine.includes(m.whId)&&!mine.includes(m.whId2)) return '−';
  }
  return '+';
};
// Подпись склада для строки истории: для перемещения показываем "источник → назначение" —
// иначе получатель видит только чужой склад-источник и не понимает, что товар приехал именно к нему
// (или наоборот, не видит, что сам являлся источником и товар уехал в другой филиал).
const moveWhLabel=m=>m.type==='transfer'&&m.whId2?esc(whName(m.whId))+' → '+esc(whName(m.whId2)):esc(whName(m.whId));

// Заказы на отгрузку продажи: одна запись — один склад-источник другого филиала. У старых продаж
// (одиночный склад-источник, поля shipStatus/shippedAt/shippedBy прямо на продаже) синтезируем
// одну запись для единообразия; у новых продаж (см. commitSale) берём s.shipments напрямую — там
// их может быть несколько, если чек собран сразу с нескольких складов (см. AskUserQuestion 2026-09).
function shipEntries(s){
  if(Array.isArray(s.shipments)) return s.shipments;
  if(s.shipStatus) return [{id:s.id+'_leg',whId:s.whId,branchId:s.branchId,items:s.items,status:s.shipStatus,shippedAt:s.shippedAt,shippedBy:s.shippedBy,legacy:true}];
  return [];
}

function returnSale(s){
  if(s.status==='returned') return;
  s.items.forEach(i=>{
    // Возвращаем остаток НА ТОТ ЖЕ склад, с которого он был продан (i.whId у запчастей — см.
    // commitSale), а не всегда на s.whId (точку продажи) — иначе при многоскладской продаже остаток
    // «прилипал» бы не туда, откуда реально ушёл. У старых продаж i.whId нет — используем s.whId,
    // как и раньше.
    const iWh=i.whId||s.whId;
    if(i.kind==='machine'){
      const u=DB.units.find(u=>u.id===i.unitId);
      if(u){u.status='in_stock';u.saleId=null;u.clientId=null;}
    }else{
      DB.stock[i.pid+'_'+iWh]=stockOf(i.pid,iWh)+i.qty;
      // Партионный учёт (FIFO), Этап 1: возвращаем количество ИМЕННО в те партии, откуда оно было
      // списано при продаже (i.lots) — иначе себестоимость остатка исказится задним числом.
      // У продаж, оформленных ДО перехода на партии, i.lots нет — тогда просто заводим одну партию
      // возврата по себестоимости, которая была зафиксирована в самой продаже (i.cost).
      if(i.lots&&i.lots.length){
        i.lots.forEach(l=>{
          if(l.lotId){
            const lot=(DB.stockLots||[]).find(x=>x.id===l.lotId);
            if(lot) lot.qtyLeft+=l.qty;
            else { DB.stockLots=DB.stockLots||[]; DB.stockLots.push({id:uid('lot'),pid:i.pid,whId:iWh,qty:l.qty,qtyLeft:l.qty,unitCost:l.unitCost,purchaseId:null,at:Date.now(),source:'return'}); }
          } else {
            DB.stockLots=DB.stockLots||[];
            DB.stockLots.push({id:uid('lot'),pid:i.pid,whId:iWh,qty:l.qty,qtyLeft:l.qty,unitCost:l.unitCost,purchaseId:null,at:Date.now(),source:'return'});
          }
        });
      } else {
        DB.stockLots=DB.stockLots||[];
        DB.stockLots.push({id:uid('lot'),pid:i.pid,whId:iWh,qty:i.qty,qtyLeft:i.qty,unitCost:i.cost||0,purchaseId:null,at:Date.now(),source:'return'});
      }
    }
    addMove({type:'return',pid:i.pid,whId:iWh,qty:i.qty,refType:'sale',refId:s.id});
  });
  if(s.clientId&&s.debtLeft>0){const c=cli(s.clientId); if(c) c.debt=Math.max(0,c.debt-s.debtLeft);}
  DB.pendings.filter(p=>p.saleId===s.id&&p.status==='waiting').forEach(p=>p.status='cancelled');
  s.debtLeft=0;
  s.status='returned'; save();
}

  const t0=startOfDay(Date.now());
  const mS=new Date(); mS.setDate(1); mS.setHours(0,0,0,0);
  // Личный кабинет продавца: на Главной он видит только СВОИ продажи (сегодня/месяц/график/
  // последние), как уже устроено в "Клиентах" и "Бланках" (см. myClients/myMethodSales) — только

/* ---- SALE ---- */
let SQ='', STAB='parts', S1='', PAYROWS=[], DISC=0, DISCCM='', CLID='', PAYDOCS={}, EDITSALE=null;
// Ключ строки корзины, для которой сейчас развёрнут список "докупить с другого склада/другой экземпляр"
// (см. cartWhToggle). Только одна строка развёрнута за раз — так проще ориентироваться в корзине.
let CARTWHPICK=null;
let CLQ='', CLNEWFROM='cart', NEWCL={name:'',phone:''}, EDITCLID=null, EDITSUPID=null;
// Приём частичного возврата долга: наличные — как раньше, мгновенно, долг уменьшается сразу.
// Перевод на карту — фото чека обязательно ДО того, как платёж записан, но сам долг клиента
// уменьшается только после подтверждения DIMAX-NEO из "Бланки" (см. debtCardSec/debtPayCardOk):
// в отличие от продажи картой, тут ничего не мешает подождать подтверждения — товар клиент уже
// получил раньше, сейчас идёт просто передача денег, поэтому долг остаётся как есть, пока
// DIMAX-NEO не проверит, что деньги реально пришли (защита от поддельного чека).
// amount хранит введённую сумму отдельно от c.debt: раньше поле ввода всегда рендерилось со значением
// "весь долг" (value="${c.debt}"), и любой повторный render() (переключение на карту, загрузка фото)
// стирал частичную сумму, которую продавец уже успел ввести — из-за этого при оплате картой всегда
// списывался весь долг, даже если ввели меньше. Теперь введённая сумма живёт здесь и переживает render().
let DEBTPAY={method:'cash',photo:'',amount:0};
// Строки корзины по товару могут теперь лежать на нескольких складах сразу (см. addFromCard) —
// для подсказки "в корзине" в списке товаров считаем суммарно по всем складам, а если склад больше
// одного — показываем разбивку, чтобы продавец видел, откуда что уже добавлено.
function cartInfo(pid){
  const lines=CART.filter(i=>i.pid===pid&&i.kind==='part');
  const qty=lines.reduce((a,i)=>a+i.qty,0);
  return {qty, lines};
}
function cartHint(pid){
  const {qty,lines}=cartInfo(pid); if(!qty) return '';
  const brk=lines.length>1?' ('+lines.map(i=>i.qty+' · '+whName(i.whId)).join(', ')+')':'';
  return ` · <span style="color:var(--accent)">${t('inCart')} ${qty}${brk}</span>`;
}
// Строка корзины, где количество уже упёрлось в остаток СВОЕГО склада (i.whId), но по компании
// в целом ещё есть незарезервированный остаток на других складах — подсказываем продавцу докупить
// прямо в корзине (см. otherWhStock/cartAddFrom), а не оставляем его гадать после тоста
// "Не хватает на складе" (см. вопрос владельца 2026-09 про "клиент хочет 10, а на складе 1").
function cartLineMoreElsewhere(i){
  if(i.kind!=='part') return 0;
  const own=stockOf(i.pid,i.whId);
  if(i.qty<own) return 0;
  const reservedTotal=cartInfo(i.pid).qty;
  const extra=visStock(i.pid)-reservedTotal;
  return extra>0?extra:0;
}
// По просьбе владельца (2026-09): докупка с другого склада должна решаться ПРЯМО в корзине, без выхода
// из неё и без переключения чипа склада на экране «Продажа» (см. cartWhToggle/cartAddFrom/cartAddUnit).
// otherWhStock — список складов (кроме текущего склада строки), где для этого товара ещё есть
// незарезервированный остаток; используется, чтобы показать продавцу, откуда можно добрать.
function otherWhStock(pid,excludeWh){
  return DB.warehouses.filter(w=>w.id!==excludeWh).map(w=>{
    const reserved=CART.filter(x=>x.pid===pid&&x.kind==='part'&&x.whId===w.id).reduce((a,x)=>a+x.qty,0);
    return {whId:w.id,avail:stockOf(pid,w.id)-reserved};
  }).filter(x=>x.avail>0).sort((a,b)=>b.avail-a.avail);
}
// Склад-источник для ПЕРВОГО добавления товара в корзину (кнопки "add"/"addFromCard"). По решению
// Владельца (2026-09) чип выбора склада на экране «Продажа» убран — продавец больше не выбирает склад
// заранее, а всегда работает со своим. Но если на своём складе товара уже 0 (или уже забрали в корзину
// весь остаток), блокировать продажу нельзя — тогда добавляем сразу с того чужого склада, где остатка
// больше всего; дальше это обычная строка корзины, докупить с других складов можно там же (cartAddFrom).
function pickSourceWh(pid){
  const own=ME.whId;
  const reservedOwn=CART.filter(x=>x.pid===pid&&x.kind==='part'&&x.whId===own).reduce((a,x)=>a+x.qty,0);
  if(stockOf(pid,own)-reservedOwn>0) return own;
  const opts=otherWhStock(pid,own);
  return opts.length?opts[0].whId:own;
}
// Для техники «докупить» означает не увеличить количество (у машины его всегда 1), а добавить ДРУГОЙ
// свободный экземпляр той же модели — возможно, с другого склада. Уже добавленные в корзину экземпляры
// исключаем, чтобы не предлагать продать один и тот же серийник дважды.
function otherUnitsForCartLine(i){
  if(i.kind!=='machine') return [];
  const u0=DB.units.find(u=>u.id===i.unitId);
  if(!u0) return [];
  return unitsOf(u0.modelId).filter(u=>u.id!==u0.id&&!CART.some(c=>c.unitId===u.id));
}
// "Наличные" всегда должны принимать остаток, чтобы сумма способов оплаты сходилась с итогом (см. тот
// же принцип уже применённый ниже для ручного ввода). До этой правки итог корзины пересчитывался при
// каждом добавлении/изменении строки, а вот уже открытая ранее сумма "Наличные" — нет: если продавец
// сначала открыл корзину (сумма подставилась под 1 позицию), закрыл её, переключил склад и добавил
// вторую строку (см. многоскладскую продажу), при повторном открытии корзины "Наличные" оставались
// старыми, и оплата переставала сходиться с новым итогом ("почему не суммируется" — вопрос владельца
// 2026-09). Вызывается после любого изменения корзины/скидки, чтобы сумма наличных всегда сама
// подстраивалась под актуальный итог, как и остальные способы оплаты уже делают при ручном вводе.
function syncCashToTotal(){
  if(!PAYROWS.length) return;
  const cashIdx=PAYROWS.findIndex(r=>r.m==='cash');
  if(cashIdx===-1) return;
  const sub=CART.reduce((a,i)=>a+i.price*i.qty,0), tot=sub-DISC;
  const restSum=PAYROWS.reduce((a,r,k)=>k===cashIdx?a:a+(+r.amount||0),0);
  PAYROWS[cashIdx].amount=Math.max(0,tot-restSum);
}

// Объединённая "Продажа": по прямой просьбе владельца (2026-09) тап по товару сначала открывает

    // По просьбе владельца (2026-09): докупка недостающего количества (запчасть — с другого склада,

    // видно уже в развёрнутом списке (там учитывается wantExtra и остаток конкретного склада).

      ${canExpand?`<button type="button" class="pill" style="margin-top:6px;border:0;cursor:pointer;background:var(--${chipClr}-soft);color:var(--${chipClr})" data-act="cartWhToggle" data-id="${i.key}">${i.kind==='part'?t('moreElsewhereHint'):t('addAnotherUnit')} (+${chipN}) ${expanded?'▲':'→'}</button>`:''}</div>

  </div>
  ${expanded&&i.kind==='part'?`<div class="list" style="margin:-2px 0 10px;gap:6px">${otherWh.map(o=>{
      const need=i.wantExtra&&i.wantExtra>0?i.wantExtra:1;
      const add=Math.min(need,o.avail);

        <div class="grow"><div class="t" style="font-size:13px">${esc(whName(o.whId))}</div><div class="s">${o.avail} ${t('units')}</div></div>
        <span class="pill" style="background:var(--accent-soft);color:var(--accent)">+${add}</span></button>`;
    }).join('')}</div>`:''}
  ${expanded&&i.kind==='machine'?`<div class="list" style="margin:-2px 0 10px;gap:6px">${otherUnits.map(u=>`
      <button type="button" class="row" style="padding:8px 10px" data-act="cartAddUnit" data-unit="${u.id}">
        <div class="grow"><div class="t mono" style="font-size:13px">${esc(u.serial)}</div><div class="s">${esc(whName(u.whId))}</div></div>
        <div class="t" style="font-size:13px">${fmt(unitValUZS(u,'price'))}</div></button>`).join('')}</div>`:''}`;

  <div class="sec-t">${t('saleDetails')}</div>
  <div class="fld" style="margin-top:2px"><label>${t('discount')}</label><input class="inp num" id="disc" inputmode="numeric" value="${DISC}"></div>

    <input class="inp" id="discCm" value="${esc(DISCCM)}" placeholder="${L==='ru'?'постоянный клиент, уценка, договорённость…':'doimiy mijoz, chegirma kelishuvi…'}">

  <div class="fld"><label>${t('client')}</label>
    <button class="inp" style="text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;color:inherit;font:inherit" data-act="clPick">
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${CLID&&cli(CLID)?esc(cli(CLID).name):t('noClient')}</span>${ic('chev','chev')}
    </button></div>

  <div class="sec-t">${t('payment')}</div>

    <button class="iconbtn" data-act="payDel" data-i="${i}">${ic('x')}</button>

    ${nd?`<button class="btn ${ok?'ghost':''} sm" style="flex:1 0 100%;margin-top:9px;${ok?'':'background:var(--warn);color:#fff'}" data-act="docOpen" data-m="${r.m}">

  s.items.forEach(i=>{
    ln.push(`${i.article}  ${i.name}`);

    ln.push(`   ${i.qty} × ${fmt(i.price)} = ${fmt(i.sum)}`);

  if(s.discount) ln.push(`${t('discount')}: −${fmt(s.discount)}  (${s.discCm||'—'})`);

let PRICE_Q='', PRICE_CAT='', PRICE_SORT='name', PRICE_SORT_DIR=1;
// ===== "Сводка по ценам" (2026-09) — отдельный ручной инструмент массового просмотра/правки цен.
// Специально НЕ трогает форму прихода/commitPurchase (там цена продажи вводится вручную по каждой
// позиции прихода) — это разные вещи: тут владелец сам, в любой момент, правит цену или наценку
// по любому товару/технике вне привязки к конкретному приходу.
function priceSummaryRows(){
  const q=PRICE_Q.trim().toLowerCase();
  const parts=DB.products.map(p=>({id:p.id, kind:'part', article:p.article, name:pname(p), catId:p.categoryId,
    stock:totalStock(p.id), cost:costOf(p), price:priceOf(p)}));
  const machines=DB.models.map(m=>({id:m.id, kind:'machine', article:m.article, name:pname(m), catId:m.groupId,
    stock:unitsOf(m.id).length, cost:costOf(m), price:priceOf(m)}));
  let rows=[...parts,...machines];
  if(q) rows=rows.filter(r=>(r.article+' '+r.name).toLowerCase().includes(q));
  if(PRICE_CAT) rows=rows.filter(r=>r.catId===PRICE_CAT);
  rows.forEach(r=>{ r.markup = r.cost>0?Math.round((r.price-r.cost)/r.cost*100):null; });
  const dir=PRICE_SORT_DIR;
  rows.sort((a,b)=>{
    if(PRICE_SORT==='stock') return (a.stock-b.stock)*dir;
    if(PRICE_SORT==='markup'){ const am=a.markup===null?-Infinity:a.markup, bm=b.markup===null?-Infinity:b.markup; return (am-bm)*dir; }
    return a.name.localeCompare(b.name)*dir;
  });
  return rows;
}

  return header(t('priceSummary'),null,`<button class="iconbtn" data-act="go" data-v="more">${ic('back')}</button>`)+`
  <div class="fld" style="padding-top:14px"><input class="inp" id="priceQ" placeholder="${t('search')}" value="${esc(PRICE_Q)}" autocomplete="off"></div>
  <div class="fld"><select class="inp" id="priceCat">

    <optgroup label="${t('machines')}">${DB.mgroups.map(g=>`<option value="${g.id}"${PRICE_CAT===g.id?' selected':''}>${esc(g[L]||g.ru)}</option>`).join('')}</optgroup>
  </select></div>
  <div class="btns" style="display:flex;gap:8px;flex-wrap:wrap">

    <button class="btn ghost sm" style="flex:1 0 auto" data-act="priceTemplate">${t('xlsxTemplateBtn')}</button>
    <button class="btn ghost sm" style="flex:1 0 auto" data-act="priceExport">⬇ ${t('xlsxExportBtn')}</button>

  <div class="pad" style="padding-top:0;color:var(--ink-3);font-size:12px">${rows.length} ${t('catItemsCount')}</div>
  <div class="scroll-x"><table class="tb">
    <thead><tr>
      <th data-act="priceSort" data-sort="name" style="cursor:pointer">${t('name')}${arrow('name')}</th>

      <td class="n">${r.stock}</td>

      <td class="n"><input class="inp num" style="width:96px;padding:6px;text-align:right" data-pp="${r.id}" data-pk="${r.kind}" data-pf="price" value="${r.price}"></td>

  </table></div>
  <div style="height:20px"></div>`;

let EDITCOST=null; // v26.54: черновик полей «$ / сум» в форме карточки (строки как введены — пустое ≠ 0)
const editObj=()=>EDITKIND==='machine'?modl(EDITID):prod(EDITID);
function collectCard(){
  const o=editObj(); if(!o) return;
  document.querySelectorAll('[data-ed]').forEach(i=>{ o[i.dataset.ed]=i.value; });
  // [data-edn] — то же самое, но для числовых полей (например, цена продажи): без этого
  // отдельного пути значение сохранилось бы строкой поверх числа и сломало бы priceOf()/
  // расчёт маржи там, где ожидается число (p.price*ставка и т.п.).
  document.querySelectorAll('[data-edn]').forEach(i=>{ o[i.dataset.edn]=Math.max(0,+i.value||0); });
  const sp=o.specs||[];
  document.querySelectorAll('[data-si]').forEach(i=>{ const ix=+i.dataset.si; if(sp[ix]) sp[ix][i.dataset.sf]=i.value; });
  o.specs=sp;
  if(EDITCOST) document.querySelectorAll('[data-edc]').forEach(i=>{ EDITCOST[i.dataset.edc]=i.value; });
}
function cardText(o){
  const sp=(o.specs||[]).filter(x=>x.k&&x.v);
  return [pname(o), o.article?'('+o.article+')':'', '', descOf(o), '',
    sp.map(x=>'• '+x.k+': '+x.v).join('\n'), '',
    t('price')+': '+fmt(priceOf(o))+' '+t('sumCur'), '',
    DB.settings.company+(DB.settings.phone?' · '+DB.settings.phone:'')].filter(x=>x!==undefined).join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function shareCard(o){
  const txt=cardText(o);
  const done=()=>toast(t('saved'));
  const fallback=()=>{ if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(()=>toast(L==='ru'?'Скопировано':'Nusxalandi'),()=>{});
    else toast(L==='ru'?'Скопировано':'Nusxalandi'); };
  const go=files=>{
    const d={title:pname(o), text:txt};
    if(files&&files.length&&navigator.canShare&&navigator.canShare({files:files})) d.files=files;
    if(navigator.share) navigator.share(d).catch(()=>{}); else fallback();
  };
  if(o.photo&&window.fetch&&window.File){
    fetch(o.photo).then(r=>r.blob()).then(b=>go([new File([b],'card.jpg',{type:'image/jpeg'})])).catch(()=>go(null));
  } else go(null);
}

function sheetProd(p){
  // У перемещения "whId" — склад-источник, "whId2" — склад-получатель; если проверять только whId,
  // получающий склад никогда не увидит в своей истории товар, который к нему же и привезли.
  const hist=DB.moves.filter(m=>m.pid===p.id&&(can('allBranches')||!ME.hasPoint||visibleWh().some(w=>w.id===m.whId||w.id===m.whId2))).sort((a,b)=>b.at-a.at).slice(0,8);
  // Склад "по умолчанию" для этого просмотра карточки: если открыта из процесса продажи — это свой
  // склад продавца (чипа выбора склада на экране «Продажа» больше нет, см. 2026-09), иначе — свой
  // склад/выбранный в «Складе».
  const ctxWh=VIEW==='sale'?ME.whId:(SWH||ME.whId);
  // На экране «Продажа» вычитаем уже отложенное в корзину со СВОЕГО склада (cartInfo) — иначе после
  // того как продавец забрал весь остаток себе в корзину, карточка при повторном открытии всё ещё
  // показывала бы "доступно" старое (нерезервированное) количество.
  const inCartHere=VIEW==='sale'?(CART.find(i=>i.pid===p.id&&i.kind==='part'&&i.whId===ctxWh)||{}).qty||0:0;
  const ctxQty=stockOf(p.id,ctxWh)-inCartHere;
  // Аналогично вычитаем из общего остатка по компании всё, что уже лежит в корзине (с любого
  // склада) — иначе после того как продавец уже собрал в корзину весь реальный остаток по всем
  // складам, подсказка всё равно предлагала бы "поискать на других складах", хотя там пусто.
  const availElsewhere=visStock(p.id)-(VIEW==='sale'?cartInfo(p.id).qty:0);
  // Раньше при нехватке на своём складе кнопка "Продажа" блокировалась, а подсказка отправляла продавца
  // переключить чип склада наверху экрана «Продажа». Чипа больше нет (см. 2026-09) — вместо блокировки
  // добавление теперь само уходит на склад с наибольшим остатком (см. pickSourceWh в обработчике add/
  // addFromCard), а тут только предупреждаем ОБ ЭТОМ, не блокируя. Блокируем кнопку, только если товара
  // действительно не осталось НИГДЕ по компании — тогда продавать просто нечего.
  const willSourceElsewhere=VIEW==='sale'&&ctxQty<=0&&availElsewhere>0;
  const outOfStock=VIEW==='sale'&&availElsewhere<=0;
  return `<div class="sheet-hd"><h3>${esc(pname(p))}</h3><button class="iconbtn" data-act="close">${ic('x')}</button></div>
  ${p.photo?`<div class="pad" style="padding-bottom:0"><img src="${esc(p.photo)}" alt="" data-card-photo data-zoom="${esc(p.photo)}" data-zoom-cap="${esc(pname(p)+' · '+p.article)}" style="cursor:zoom-in;width:100%;max-height:300px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block"></div>`:''}
  ${descOf(p)?`<div class="pad" style="padding-bottom:0;font-size:13.5px;color:var(--ink-2);line-height:1.5;white-space:pre-wrap">${esc(descOf(p))}</div>`:''}

/* ---- STOCK ---- */
let SWH=null, WTAB='parts', SC1='', SKQ='';
function screenStock(){
  if(!SWH) SWH=ME.whId;
  let body='';
  if(WTAB==='parts'){
    const val=DB.products.reduce((a,p)=>a+stockOf(p.id,SWH)*costOf(p),0);
    const q=SKQ.trim().toLowerCase();
    // Список запчастей на Складе раньше был одним общим списком, отсортированным по нехватке —
    // при 20-50 категориях и от 50 деталей в каждой (см. масштаб каталога) это было неудобно листать.
    // По просьбе владельца (2026-09) разбили по тем же категориям, что на «Продаже»/«Товарах»:
    // тап по категории → список деталей в ней; нехватка теперь видна значком на самой категории,
    // а не сортировкой всего списка целиком.
    const stockRow=p=>{ const qty=stockOf(p.id,SWH), low=qty<=p.minStock;
      return `<button class="row" data-act="prod" data-id="${p.id}">
      ${p.photo?itemTile(p):`<div class="tile thumb" ${low?'style="background:var(--warn-soft);color:var(--warn)"':''}>${esc(p.article.split('-')[1]?p.article.split('-')[1].slice(0,2):p.article.slice(0,2))}</div>`}
      <div class="grow"><div class="t">${esc(pname(p))}</div><div class="s mono">${esc(p.article)} · min ${p.minStock}</div></div>
      <div class="r"><div class="t" style="color:${low?'var(--warn)':'var(--ink)'}">${qty}</div>${can('cost')?`<div class="s mono">${short(qty*costOf(p))}</div>`:''}</div></button>`; };
    let listHtml='', catHeader='';
    if(q){
      const list=DB.products.filter(p=>(p.article+' '+p.nameRu+' '+p.nameUz+' '+(p.barcode||'')).toLowerCase().includes(q));
      listHtml=list.length?list.map(stockRow).join(''):`<div class="empty">${t('nothing')}</div>`;
    }else if(!SC1){
      listHtml=DB.categories.map(c=>{
        const items=DB.products.filter(p=>p.categoryId===c.id);
        const lowN=items.filter(p=>stockOf(p.id,SWH)<=p.minStock).length;
        return `<button class="row" data-act="sc1" data-id="${c.id}">
          <div class="tile">${ic('box')}</div>
          <div class="grow"><div class="t">${esc(c[L]||c.ru)}</div><div class="s">${items.length} ${t('catItemsCount')}</div></div>
          ${lowN?`<span class="pill warn" style="flex:none">${lowN}</span>`:''}
          ${ic('chev','chev')}</button>`;
      }).join('')+(can('settings')?`<div class="btns" style="padding-top:10px"><button class="btn ghost sm" data-act="catMng">✎ ${t('categories')}</button></div>`:'');
    }else{
      const list=DB.products.filter(p=>p.categoryId===SC1);
      catHeader=`<div style="display:flex;align-items:center;gap:10px;padding:6px 4px 8px">
        <button class="iconbtn" data-act="sc1" data-id="">${ic('back')}</button>
        <div style="font-weight:700;font-size:16px">${esc(catName(SC1))}</div></div>`;
      listHtml=list.map(stockRow).join('')||`<div class="empty">${t('nothing')}</div>`;
    }
    body=`${can('cost')?`<div class="stats" style="padding-top:0"><div class="stat wide"><div class="k">${L==='ru'?'Стоимость запчастей':'Qismlar qiymati'}</div><div class="v">${short(val)} <small>${t('sumCur')}</small></div></div></div>`:''}
    <div class="sec-t">${t('left')} ${can('cost')?`<a data-act="journal">${t('journal')} →</a>`:''}</div>
    <div class="fld"><input class="inp" id="skq" placeholder="${t('search')}" value="${esc(SKQ)}" autocomplete="off"></div>
    ${catHeader}<div class="list">${listHtml}</div>`;
  }else{
    const us=DB.units.filter(u=>u.whId===SWH&&activeUnit(u));
    const val=us.reduce((a,u)=>a+unitValUZS(u,'cost'),0);
    body=`${can('cost')?`<div class="stats" style="padding-top:0"><div class="stat wide"><div class="k">${L==='ru'?'Стоимость техники':'Texnika qiymati'}</div><div class="v" style="color:var(--steel)">${short(val)} <small>${t('sumCur')}</small></div><div class="d">${us.length} ${t('units')}</div></div></div>`:''}
    <div class="sec-t">${t('machines')}</div>
    <div class="list">${us.length?us.map(u=>{const m=modl(u.modelId);
      return `<button class="row" data-act="model" data-id="${u.modelId}">
        <div class="tile mach">${ic('tractor')}</div>
        <div class="grow"><div class="t">${esc(pname(m))}</div><div class="s mono">${esc(u.serial)} · ${u.year}</div></div>
        <div class="r">${statusPill(u.status)}</div></button>`;}).join(''):`<div class="empty">${t('noUnits')}</div>`}</div>`;
  }
  return header(t('stock'),whName(SWH))+`
  ${visibleWh().length>1?`<div class="chips" style="padding-top:12px">${visibleWh().map(w=>`<button class="${SWH===w.id?'on':''}" data-act="swh" data-id="${w.id}">${esc(whName(w.id))}</button>`).join('')}</div>`:'<div style="height:10px"></div>'}
  ${can('stockOps')?`<div class="btns" style="padding-bottom:8px"><button class="btn sm" data-act="op" data-op="inv">${ic('inv')} ${t('invent')}</button></div>
  <div class="pad" style="padding:0 16px 10px;color:var(--ink-3);font-size:11.5px;margin-top:-4px">${t('invBothHint')}</div>`:''}
  <div class="seg"><button class="${WTAB==='parts'?'on':''}" data-act="wtab" data-v="parts">${t('parts')}</button>
    <button class="${WTAB==='mach'?'on':''}" data-act="wtab" data-v="mach">${t('machines')}</button></div>
  ${actionRow(WTAB==='parts'?[
    // "Приход" убран отсюда (2026-09) — весь раздел "Приход" переехал в "Ещё" (см. sheetPurNewChoice/
    // screenPurchases); эта кнопка раньше вела прямиком в sheetPurchase(op:'in'), в обход нового
    // объединённого выбора "Вручную"/"Через Excel" — то есть дублировала и путала реорганизацию.
    // "Переместить" не показываем, если реально видим/имеем только один склад — переносить некуда,
    // между разными филиалами перемещения делает только Владелец (у него все склады видны)
    ...(visibleWh().length>1?[{ic:'truck',label:t('move'),act:'op',op:'transfer'}]:[]),
    // Списание — только Владелец (can('approve')). По прямому решению Владельца (2026-09) продавцам
    // эта кнопка больше не показывается вовсе: раньше менеджер мог отправить запрос на списание,
    // теперь списывать может только сам Владелец, напрямую и без подтверждения.
    // v26.63: «Списание» перенесено в «Ещё» (по решению владельца) — здесь кнопки больше нет
  ]:[
    // "Добавить машину" убрана отсюда (2026-09) — по тому же решению, что и "Приход" у запчастей:
    // приём техники теперь полностью живёт в "Ещё" → "Приходы" (см. sheetPurNewChoice — "Приход
    // техники" ищет существующую модель, "+ Новая техника" заводит новую), а не на "Складе".
    // Перемещение техники между складами — тот же принцип, что и у запчастей: без него единицу,
    // один раз принятую не на тот склад, было бы физически невозможно перекинуть филиалу через приложение
    ...(visibleWh().length>1?[{ic:'truck',label:t('move'),act:'op',op:'transfer'}]:[]),
    // Списание техники (поломка/утеря) — только Владелец, см. комментарий выше про запчасти
    // v26.63: «Списание» перенесено в «Ещё» (по решению владельца) — здесь кнопки больше нет
  ])}
  ${body}`;
}
function actionRow(items){
  if(!items.length) return '';
  return `<div style="display:flex;gap:20px;padding:2px 16px 14px;overflow-x:auto">${items.map(o=>`
    <button data-act="${o.act}"${o.op?` data-op="${o.op}"`:''}${o.id?` data-id="${o.id}"`:''} style="display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;min-width:60px;background:none;border:none">
      <div class="tile" style="width:46px;height:46px">${ic(o.ic)}</div>
      <div style="font-size:11px;color:var(--ink-2);text-align:center;line-height:1.2;white-space:nowrap">${esc(o.label)}</div>
      ${o.lock?`<div style="font-size:9.5px;color:var(--ink-3)">${t('ownerOnly')}</div>`:''}
    </button>`).join('')}</div>`;
}

let INVRESULT=[], INVMISSING=[], INVOVER=[], INVSTEP='mach';

function uzClean(v){
  return String(v==null?'':v)
    .replace(/&#x27;|&#39;|&apos;|&quot;/g, m=>m==='&quot;'?'"':"'")
    .replace(/[`´‘’ʼʻ‛′]/g, "'")
    .replace(/\s+/g,' ').trim();
}
function uzLat(v){
  let s=uzClean(v);
  s=s.replace(/O'/g,'Oʻ').replace(/o'/g,'oʻ').replace(/G'/g,'Gʻ').replace(/g'/g,'gʻ');
  return s.replace(/'/g,'ʼ');
}
function uzCyr(v){
  let s=uzClean(v);
  s=s.replace(/O'/g,'Ў').replace(/o'/g,'ў').replace(/G'/g,'Ғ').replace(/g'/g,'ғ');
  const d2={sh:'ш',ch:'ч',ya:'я',yo:'ё',yu:'ю',ye:'е',ts:'ц'};
  const d1={a:'а',b:'б',d:'д',e:'е',f:'ф',g:'г',h:'ҳ',i:'и',j:'ж',k:'к',l:'л',m:'м',n:'н',
    o:'о',p:'п',q:'қ',r:'р',s:'с',t:'т',u:'у',v:'в',x:'х',y:'й',z:'з',c:'с',w:'в',"'":'ъ'};
  const isUp=c=>c===c.toUpperCase()&&c!==c.toLowerCase();
  let out='',i=0,ws=true;
  while(i<s.length){
    const c=s[i], lo=c.toLowerCase(), two=s.substr(i,2).toLowerCase();
    let r=null,len=1;
    if(d2[two]!==undefined){ r=d2[two]; len=2; }
    else if(lo==='e'&&ws){ r='э'; }
    else if(d1[lo]!==undefined){ r=d1[lo]; }
    if(r===null){ out+=c; ws=!/[0-9A-Za-zА-Яа-яЁёЎўҒғҚқҲҳ]/.test(c); i++; continue; }
    if(isUp(c)) r = (len===2&&isUp(s[i+1])) ? r.toUpperCase() : r.charAt(0).toUpperCase()+r.slice(1);
    out+=r; i+=len; ws=false;
  }
  return out;
}
// написание по языку интерфейса: русский — кириллица, узбекский — латиница
function cyr2lat(v){
  const s=String(v==null?'':v);
  const M={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'j','з':'z','и':'i','й':'y',
    'к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'x',
    'ц':'ts','ч':'ch','ш':'sh','щ':'sh','ъ':'ʼ','ы':'i','ь':'','э':'e','ю':'yu','я':'ya',
    'ў':'oʻ','ғ':'gʻ','қ':'q','ҳ':'h'};
  const isUp=c=>c===c.toUpperCase()&&c!==c.toLowerCase();
  let out='';
  for(const c of s){
    const r=M[c.toLowerCase()];
    if(r===undefined){ out+=c; continue; }
    out += isUp(c) ? (r.length>1 ? r.charAt(0).toUpperCase()+r.slice(1) : r.toUpperCase()) : r;
  }
  return out;
}

function lookupInn(inn,cb){
  inn=cleanInn(inn);
  if(inn.length<9){ cb(null,t('innHint')); return; }
  const c=firmByInn(inn);
  // Из кэша отвечаем сразу без обращения к реестру, только если запись уже подтверждена (source) —
  // иначе одна неаккуратная ручная фирма навсегда блокировала бы повторную проверку по ИНН.
  if(c&&c.source&&(c.nameShort||c.nameFull)){ cb(c); return; }
  const api=(DB.settings.orgApi||'').trim();
  if(!api){ if(c&&(c.nameShort||c.nameFull)){ cb(c); return; } cb(null,t('noApi')); return; }
  // Порядковый номер запроса — если пользователь успел кликнуть "Найти" второй раз (например,
  // исправив опечатку в ИНН) до ответа первого запроса, более медленный первый ответ не должен
  // затереть уже применённый результат второго, более свежего запроса.
  const myReq=++INNREQSEQ;
  INNBUSY=true; render();
  const url=api+(api.indexOf('?')>=0?'&':'?')+'inn='+inn;

    INNBUSY=false;
    const m=String(err&&err.message||err);
    const net=/Failed to fetch|NetworkError|Load failed|CSP|blocked/i.test(m);

let MARKETBUSY=false, MARKETFAIL=false, MARKETTRIED=false, MARKETNET=false;
function parseBankUzUsdBuy(html){
  // На странице bank.uz/currency курс USD показан в виджете "Лучшие курсы обмена" —
  // блок <div id="best_USD">, внутри которого сначала идёт раздел «Покупка» (несколько
  // банков), затем «Продажа». Берём только раздел «Покупка» и ищем минимальное
  // значение вида "11 780 сум", отбрасывая нулевые (банк не даёт котировку).
  const pi=html.indexOf('id="best_USD"');
  if(pi<0) return null;
  const nextPane=html.indexOf('tab-pane',pi+10);
  const panel=nextPane>pi?html.slice(pi,nextPane):html.slice(pi,pi+6000);
  const bi=panel.indexOf('Покупка');
  if(bi<0) return null;
  const si=panel.indexOf('Продажа',bi);
  const buySeg=si>bi?panel.slice(bi,si):panel.slice(bi);
  const nums=[]; const re=/(\d[\d\s ]*)\s*сум/g; let m;
  while((m=re.exec(buySeg))){ const v=parseInt(m[1].replace(/[\s ]/g,''),10); if(v>0) nums.push(v); }
  return nums.length?Math.min(...nums):null;
}

function rusWords(n){
  n=Math.round(n||0); if(!n) return 'ноль';
  const ed=['','один','два','три','четыре','пять','шесть','семь','восемь','девять'];
  const edF=['','одна','две','три','четыре','пять','шесть','семь','восемь','девять'];
  const d10=['десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'];
  const des=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];
  const sot=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];
  const forms=[['','',''],['тысяча','тысячи','тысяч'],['миллион','миллиона','миллионов'],['миллиард','миллиарда','миллиардов'],['триллион','триллиона','триллионов']];
  const pick=(x,f)=>{const a=x%100,b=x%10; if(a>10&&a<20) return f[2]; if(b===1) return f[0]; if(b>1&&b<5) return f[1]; return f[2];};
  const trio=(x,fem)=>{const w=[]; const s=Math.floor(x/100), t=Math.floor((x%100)/10), u=x%10;
    if(s) w.push(sot[s]);
    if(t===1) w.push(d10[u]); else { if(t) w.push(des[t]); if(u) w.push((fem?edF:ed)[u]); }
    return w.join(' ');};
  const parts=[]; let i=0;
  while(n>0){ const x=n%1000; n=Math.floor(n/1000);
    if(x){ const w=trio(x,i===1); parts.unshift(i?w+' '+pick(x,forms[i]):w); }
    i++; }
  const s=parts.join(' ').trim();
  return s.charAt(0).toUpperCase()+s.slice(1);
}
