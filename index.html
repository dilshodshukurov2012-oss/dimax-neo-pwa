// "Оплаты и документы" (2026-09, разделение экрана): здесь остаётся ТОЛЬКО очередь подтверждения
// оплат по переводу/карте/Smart Market — критическая для продавцов/менеджеров функция, видна всем
// ролям как раньше (см. bottom nav — позиция/иконка/бейдж dcnt не менялись). Создание документов
// с нуля и реестры уехали в screenDocsContracts() (см. ниже), доступный только владельцу из «Ещё».
function screenDocs(){
  const subHead=(lbl,n)=>`<div class="pad" style="padding:10px 16px 4px;color:var(--ink-3);font-size:11px;font-family:var(--m);letter-spacing:.06em;text-transform:uppercase">${lbl} · ${n}</div>`;
  // Перевод, карта и Smart Market — все три требуют отдельного подтверждения владельца (см. CONFIRM_KEY)
  // и все три можно сохранить без него, поэтому продажи, ждущие подтверждения, показываем одинаково —
  // тремя параллельными разделами (Пустые/Ждут/Оформлены), см. AskUserQuestion-решение этого сеанса.
  const methodSec=(m,secKey)=>{
    const list=myMethodSales(m);
    const emptyL=list.filter(s=>methodIncomplete(m,s)&&!methodFieldsTouched(m,s));
    const pendingL=list.filter(s=>methodIncomplete(m,s)&&methodFieldsTouched(m,s));
    const doneL=list.filter(s=>!methodIncomplete(m,s));
    const logo=PMLOGO[m];
    return `<div class="sec-t"><span style="display:flex;align-items:center;gap:6px">${logo?`<img class="sec-logo" src="${logo}" alt="">`:''}${t(secKey)}</span></div>
    ${list.length?`
      ${emptyL.length?subHead(t('smartEmptyLbl'),emptyL.length)+`<div class="list">${emptyL.map(s=>methodSaleRow(s,'empty',m)).join('')}</div>`:''}
      ${pendingL.length?subHead(t('smartPendingLbl'),pendingL.length)+`<div class="list">${pendingL.map(s=>methodSaleRow(s,'pending',m)).join('')}</div>`:''}
      ${doneL.length?subHead(t('smartDoneLbl'),doneL.length)+`<div class="list">${doneL.map(s=>methodSaleRow(s,'done',m)).join('')}</div>`:''}
    `:`<div class="list"><div class="empty">${t('noDocs')}</div></div>`}`;
  };
  return header(t('forms'),null)+`
  ${methodSec('transfer','docsTransferSec')}
  ${methodSec('card','docsCardSec')}
  ${debtCardSec()}
  ${methodSec('smart','docsSmartSec')}
  <div style="height:20px"></div>`;
}

const MONTHS_UZ=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentyabr','oktyabr','noyabr','dekabr'];
function dateWordsUz(ts){const d=new Date(ts);return `${d.getFullYear()}-yil ${d.getDate()}-${MONTHS_UZ[d.getMonth()]}`;}
function uzWords(n){
  n=Math.round(n||0); if(!n) return 'nol';
  const b=['','bir','ikki','uch','toʻrt','besh','olti','yetti','sakkiz','toʻqqiz'];
  const o=['','oʻn','yigirma','oʻttiz','qirq','ellik','oltmish','yetmish','sakson','toʻqson'];
  const g=['','ming','million','milliard','trillion'];
  const trio=x=>{const w=[],s=Math.floor(x/100),t2=Math.floor((x%100)/10),u=x%10;
    if(s) w.push(b[s],'yuz'); if(t2) w.push(o[t2]); if(u) w.push(b[u]); return w.join(' ');};
  const parts=[]; let i=0;
  while(n>0){const x=n%1000; n=Math.floor(n/1000);
    if(x) parts.unshift(i?trio(x)+' '+g[i]:trio(x)); i++;}
  const s=parts.join(' ').replace(/\s+/g,' ').trim();
  return s.charAt(0).toUpperCase()+s.slice(1);
}
const numWords=n=>L==='uz'?uzWords(n):rusWords(n);

function docText(d){
  const f=d.fields||{};
  const L2=[`${DB.settings.company} — ${RU(d.type)}`,`№ ${d.number} от ${dfmt(d.at)}`,''];
  if(f.buyer||f.forWhom) L2.push(`${d.type==='kp'?RU('forWhom'):RU('buyerParty')}: ${f.buyer||f.forWhom}`);
  if(f.inn) L2.push(`${d.party==='fiz'?RU('passport'):RU('inn')}: ${f.inn}${f.director?' · '+f.director:''}`);
  if(d.type==='gt'){ L2.push(`${f.model||''}`,`${RU('serial')}: ${f.serial||''}`,
    `${RU('warrantyM')}: ${f.warrantyM} мес.${f.motoH?' / '+f.motoH+' моточасов':''}`,
    f.till?`Гарантия до ${dfmt(f.till)}`:''); }
  (d.items||[]).forEach(i=>{ L2.push(`• ${i.article} ${i.name} — ${i.qty} × ${fmt(i.price)} = ${fmt(i.price*i.qty)}`);
    if(d.type==='kp'){ const o=docObj(i); if(o){ const ds=descOf(o);
      if(ds) L2.push('  '+ds.replace(/\n/g,'\n  '));
      (o.specs||[]).filter(x=>x.k&&x.v).forEach(x=>L2.push(`  - ${x.k}: ${x.v}`)); } } });
  if(d.total) L2.push('', `${RU('total')}: ${fmt(d.total)} ${RU('sumCur')}`, `( ${numWords(d.total).toLowerCase()} ${RU('sumCur')} )`);
  if(f.validDays) L2.push(`Действительно ${f.validDays} дней.`);
  if(f.terms) L2.push('', f.terms);
  L2.push('', DB.settings.phone||'');
  return L2.filter(x=>x!==undefined).join('\n');
}

// Заказы на отгрузку: продажа, где товар списался со склада ЧУЖОГО филиала (продавец добрал его
// прямо в корзине — см. otherWhStock/cartAddFrom). Видит их Владелец (все) и любой сотрудник филиала-владельца
// склада (branchId записи = branchId склада списания, а не филиала продавца) — им нужно физически
// подготовить доставку/самовывоз и отметить «Отгружено». Одна продажа может дать НЕСКОЛЬКО таких
// записей сразу, если чек собран с нескольких складов разных филиалов (см. commitSale/shipEntries) —
// по прямому решению Владельца (2026-09) каждый филиал видит и подтверждает только свою часть.
function shipList(){
  const out=[];
  (DB.sales||[]).forEach(s=>{ shipEntries(s).forEach(e=>{ if(can('allBranches')||e.branchId===ME.branchId) out.push({sale:s,entry:e}); }); });
  return out;
}
function screenShipments(){
  const all=shipList();
  const P=all.filter(x=>x.entry.status==='pending').sort((a,b)=>b.sale.at-a.sale.at);
  const H=all.filter(x=>x.entry.status==='done').sort((a,b)=>(b.entry.shippedAt||0)-(a.entry.shippedAt||0)).slice(0,10);
  const srow=(x,act)=>{
    const s=x.sale, e=x.entry;
    const seller=usr(s.userId), buyerBranch=seller?DB.branches.find(b=>b.id===seller.branchId):null;
    const names=e.items.map(i=>`${i.name} × ${i.qty}`).join(', ');
    return `<div class="row" style="flex-wrap:wrap">
    <div class="tile" style="background:${e.status==='done'?'var(--accent-soft)':'var(--warn-soft)'};color:${e.status==='done'?'var(--accent)':'var(--warn)'}">${ic('truck')}</div>

function commitPurchase(){
  const total=purTotal();
  // cur/extraUZS/paid/debt держим нулевыми полями (не удаляем совсем) только ради обратной
  // совместимости отображения sheetPurView/screenPurchases — сам упрощённый приход больше не
  // работает с валютой партии, доп. расходами или долгом поставщику (см. комментарий выше).
  const p={id:uid('pu'),number:docNo('purchase'),at:Date.now(),userId:ME.id,
    supplierId:PUR.supplierId,whId:PUR.whId,cur:'UZS',
    items:PUR.items.map(i=>{ const c=Object.assign({},i); delete c.sellPriceTouched; return c; }),
    goodsUZS:total,extraUZS:0,landedUZS:total,paid:0,debt:0};
  const usd=DB.settings.usdRate||12650;
  const priceAdjustments=[]; // сюда собираем "было→стало", чтобы одним тостом показать владельцу
  p.items.forEach(i=>{
    // Цена позиции уже введена в сумах за единицу — доп. расходов для распределения больше нет,
    // поэтому себестоимость единицы товара/техники — это просто цена за единицу как есть.
    const unitLanded=+i.price||0;
    i.costUZS=Math.round(unitLanded);
    // Цена продажи (2026-09) больше не пересчитывается автоматически по формуле — она равна
    // РОВНО тому, что владелец ввёл/подтвердил в форме прихода (i.sellPrice), уже провалидированному
    // выше (purCommit) как обязательное положительное число. Меняем в ЛЮБУЮ сторону, не только вверх.
    const newPriceUZS=Math.round(+i.sellPrice||0);
    if(i.kind==='machine'){
      const m=modl(i.pid), n=Math.max(1,+i.qty||1), ser=i.serials||[];
      if(m){
        const oldPriceUZS=priceOf(m);
        m.cost=m.cur==='USD'?Math.round(unitLanded/usd*100)/100:Math.round(unitLanded);
        m.price=m.cur==='USD'?Math.round(newPriceUZS/usd*100)/100:newPriceUZS;
        if(newPriceUZS!==oldPriceUZS) priceAdjustments.push({name:pname(m), oldPrice:oldPriceUZS, newPrice:newPriceUZS});
      }
      for(let j=0;j<n;j++){
        // purchaseId — чтобы отмена прихода (см. cancelPurchase) могла надёжно найти именно ЭТИ
        // единицы техники, а не гадать по серийнику/модели (для приходов, заведённых ДО этого поля,
        // cancelPurchase сама подстраховывается сопоставлением по серийнику — см. там).
        DB.units.push({id:uid('un'),modelId:i.pid,serial:String(ser[j]||'').trim()||('—'+(Date.now()+j)),
          year:new Date().getFullYear(),whId:PUR.whId,status:'in_stock',
          cost:m?m.cost:0,price:m?m.price:0,saleId:null,clientId:null,purchaseId:p.id});
      }
      addMove({type:'in',pid:i.pid,whId:PUR.whId,qty:n,refType:'purchase',refId:p.id,comment:ser.slice(0,n).join(', ')});
    } else {
      const pr=prod(i.pid);
      if(pr){
        const oldPriceUZS=priceOf(pr);
        DB.stockLots=DB.stockLots||[];
        DB.stockLots.push({id:uid('lot'),pid:pr.id,whId:PUR.whId,qty:+i.qty||0,qtyLeft:+i.qty||0,
          unitCost:unitLanded,purchaseId:p.id,at:p.at,source:'purchase'});
        pr.cost=Math.round(costOf(pr)); // кэш для отображения на карточке — источник истины теперь в DB.stockLots
        pr.price=pr.cur==='USD'?Math.round(newPriceUZS/usd*100)/100:newPriceUZS;
        if(newPriceUZS!==oldPriceUZS) priceAdjustments.push({name:pname(pr), oldPrice:oldPriceUZS, newPrice:newPriceUZS});
      }
      DB.stock[i.pid+'_'+PUR.whId]=stockOf(i.pid,PUR.whId)+(+i.qty||0);
      addMove({type:'in',pid:i.pid,whId:PUR.whId,qty:+i.qty||0,refType:'purchase',refId:p.id});
    }
  });
  p.priceAdjustments=priceAdjustments; // сохраняем в саму запись, а не только для разового тоста —
  // чтобы через день/месяц при просмотре истории прихода (sheetPurView) было видно, что и почему
  // изменилось в цене продажи именно из-за ЭТОГО прихода.
  DB.purchases.push(p); save(); return {purchase:p, priceAdjustments};
}
// Отмена прихода (2026-09, по прямому решению Владельца) — раньше ошибочный приход нельзя было
// откатить ничем, кроме ручной правки остатков/категорий, а сама запись так и оставалась в истории,
// будто всё верно. cancelPurchase() снимает РОВНО то, что этот приход добавил, и не больше: если
// часть товара/техники уже продана, списана или перемещена дальше — эта часть остаётся как есть
// (откатить её значило бы разрушить уже случившуюся, отдельную операцию), а отменяется только то,
// что реально ещё лежит нетронутым с момента этого прихода. Сам приход НЕ удаляется из истории —
// помечается p.cancelled=true, ровно как returnSale() помечает status='returned' у продаж, а не
// стирает их. Себестоимость/цена продажи, которые мог поменять этот приход (p.priceAdjustments),
// сознательно НЕ откатываются — это отдельное решение владельца, не всегда напрямую связанное
// с ошибкой в количестве/складе/категории, которую отменяет эта функция.
function cancelPurchase(p){
  if(p.cancelled) return {fullyReversed:[], partiallyReversed:[], notReversed:[]};
  const fullyReversed=[], partiallyReversed=[], notReversed=[];
  p.items.forEach(i=>{
    const n=Math.max(1,+i.qty||1);
    if(i.kind==='machine'){
      const serials=(i.serials||[]).filter(Boolean);
      // Сначала пытаемся найти единицы техники по purchaseId (приходы, заведённые уже с этим полем —
      // см. commitPurchase), а для старых приходов без него — по серийнику+модели как запасной вариант.
      let units=DB.units.filter(u=>u.purchaseId===p.id);
      if(!units.length) units=DB.units.filter(u=>u.modelId===i.pid&&serials.includes(u.serial));
      let removed=0;
      units.forEach(u=>{ if(u.status==='in_stock'){ DB.units=DB.units.filter(x=>x.id!==u.id); removed++; } });
      if(removed>0&&removed>=n) fullyReversed.push(i.name);
      else if(removed>0) partiallyReversed.push(i.name+' ('+removed+'/'+n+')');
      else notReversed.push(i.name);
    } else {
      const lots=(DB.stockLots||[]).filter(l=>l.purchaseId===p.id&&l.pid===i.pid);
      let reversedQty=0;
      lots.forEach(lot=>{
        reversedQty+=lot.qtyLeft;
        DB.stock[lot.pid+'_'+lot.whId]=Math.max(0, stockOf(lot.pid,lot.whId)-lot.qtyLeft);
      });
      DB.stockLots=(DB.stockLots||[]).filter(l=>!(l.purchaseId===p.id&&l.pid===i.pid));
      if(reversedQty>0&&reversedQty>=n) fullyReversed.push(i.name);
      else if(reversedQty>0) partiallyReversed.push(i.name+' ('+reversedQty+'/'+n+')');
      else notReversed.push(i.name);
    }
  });
  p.cancelled=true; p.cancelledAt=Date.now(); p.cancelledBy=ME.id;
  save();
  return {fullyReversed, partiallyReversed, notReversed};
}

/* ---- Редактирование прихода "на месте" (2026-09, по прямому решению Владельца) ----
   В отличие от cancelPurchase() (весь приход целиком помечается отменённым), здесь МЕНЯЮТСЯ поля
   уже проведённого прихода без пересоздания — поставщик/склад свободно, количество/цена закупки/
   цена продажи по каждой позиции — С ТЕМ ЖЕ ограничением, что и у отмены: нельзя откатить то, что
   уже физически продано/списано/уехало дальше. Технику по количеству здесь НЕ редактируем вообще —
   это отдельная операция (добавление/списание конкретных серийных единиц), слишком рискованно
   сводить к одному текстовому полю; для техники редактируются только цена закупки и цена продажи. */
// Пытается уменьшить/увеличить количество и поменять себестоимость строки-запчасти. Возвращает
// qtyCapped=true, если запрошенное уменьшение упёрлось в уже проданный/списанный остаток и было
// урезано до минимально возможного, а не отклонено целиком — чтобы редактирование остальных полей
// (цену, например) всё равно можно было сохранить одним действием.

// Себестоимость по позиции техники — применяется ко ВСЕМ ещё не проданным единицам этого прихода
// (уже проданные хранят свою историческую себестоимость нетронутой, как и везде в приложении).

// Меняет цену продажи товара/модели, НО ТОЛЬКО если текущая живая цена всё ещё равна тому, что
// установил именно ЭТОТ приход в последний раз (см. i.sellPrice) — если её успели поменять ещё раз
// (новый приход, ручная правка в "Сводке по ценам" и т.п.), молча затирать её задним числом нельзя.

// Перенос ещё не проданного/не списанного остатка на другой склад — ровно та же логика, что и у
// cancelPurchase: то, что уже ушло со старого склада (продано/перемещено дальше), остаётся там,
// переезжает только qtyLeft/ещё не проданные единицы техники.

/* ============ EXCEL (.xlsx) импорт/экспорт — общая инфраструктура (2026-09) ============
   SheetJS (xlsx.full.min.js) грузится ЛЕНИВО с CDN — не при старте приложения (не увеличиваем
   время загрузки и не требуем интернет тем, кто Excel-функциями не пользуется), а только в момент
   первого клика на любую Excel-кнопку. Дальше браузер сам кэширует файл — повторные обращения
   в сеть уже не идут. Если интернета нет и скрипт не подгрузился — тост, без падения интерфейса. */
const XLSX_CDN='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
let XLSX_LOADING=false, XLSX_WAITERS=[];
function ensureXLSX(cb){
  if(window.XLSX){ cb(); return; }
  XLSX_WAITERS.push(cb);
  if(XLSX_LOADING) return;
  XLSX_LOADING=true;
  const s=document.createElement('script');
  s.src=XLSX_CDN;
  s.onload=()=>{ XLSX_LOADING=false; const ws=XLSX_WAITERS.splice(0); ws.forEach(w=>w()); };
  s.onerror=()=>{ XLSX_LOADING=false; XLSX_WAITERS=[]; toast(t('xlsxNeedInternet')); };
  document.head.appendChild(s);
}
function xlsxDateStr(){ const d=new Date(); const pad=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
// sheets: [{name, rows}] — rows это массив ПЛОСКИХ объектов {Колонка:значение}: ключи первого
// объекта в массиве и становятся заголовками столбцов (см. XLSX.utils.json_to_sheet).
function exportXlsxFile(fileNameBase, sheets){
  ensureXLSX(()=>{
    try{
      const wb=XLSX.utils.book_new();
      (sheets||[]).forEach(sh=>{
        const ws=XLSX.utils.json_to_sheet(sh.rows&&sh.rows.length?sh.rows:[{'—':''}]);
        XLSX.utils.book_append_sheet(wb, ws, String(sh.name).slice(0,31));
      });
      XLSX.writeFile(wb, fileNameBase+'_'+xlsxDateStr()+'.xlsx');
    }catch(e){ toast(t('xlsxNeedInternet')); }
  });
}
function importXlsxFile(file, onRows){
  ensureXLSX(()=>{
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const wb=XLSX.read(fr.result,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
        onRows(rows);
      }catch(e){ toast(t('xlsxBadFile')); }
    };
    fr.onerror=()=>toast(t('xlsxBadFile'));
    fr.readAsArrayBuffer(file);
  });
}

// (без учёта регистра/пробелов) — пропуск (НЕ создаём дубликат, НЕ обновляем существующий товар,
// по прямому решению Владельца). Отсутствующая категория создаётся автоматически тем же способом,
// что и catAdd в Настройках — {id,ru,uz} с uz пустым, если явно не указан отдельный столбец под него.
function importPriceRows(rawRows){
  const added=[], skipped=[], errors=[];
  const existing=new Set(DB.products.map(p=>p.article.trim().toLowerCase()));
  (rawRows||[]).forEach(row=>{
    const article=String(row['Артикул']||'').trim();
    const nameRu=String(row['Название RU']||'').trim();
    if(!article){ errors.push({article:'—', reason:t('xlsxNoArticle')}); return; }
    if(!nameRu){ errors.push({article, reason:t('xlsxNoName')}); return; }
    if(existing.has(article.toLowerCase())){ skipped.push({article, reason:t('xlsxDupArticle')}); return; }
    const nameUz=String(row['Название UZ']||'').trim()||nameRu;
    const catText=String(row['Категория']||'').trim();
    let categoryId=(DB.categories[0]||{}).id;
    if(catText){
      let cat=DB.categories.find(c=>(c.ru||'').trim().toLowerCase()===catText.toLowerCase()||(c.uz||'').trim().toLowerCase()===catText.toLowerCase());
      if(!cat){ cat={id:newId(), ru:catText, uz:''}; DB.categories.push(cat); }
      categoryId=cat.id;
    }
    const np={id:newId(),kind:'part',article,nameRu,nameUz,categoryId,brand:String(row['Бренд']||'').trim(),
      cost:+row['Себестоимость']||0, price:+row['Цена продажи']||0, cur:'UZS', minStock:+row['Мин. остаток']||3,
      barcode:'20'+Math.floor(Math.random()*10000000).toString().padStart(8,'0')};
    DB.products.push(np);
    existing.add(article.toLowerCase());
    added.push(article);
  });
  if(added.length){
    const knownC=new Set((RAW.categories||[]).map(c=>c.id)), knownP=new Set((RAW.products||[]).map(x=>x.id));
    insertCatalog(DB.categories.filter(c=>!knownC.has(c.id)), DB.products.filter(x=>!knownP.has(x.id)))
      .then(()=>refresh(['categories','products','product_costs'])).catch(toastErr);
  }
  return {added, skipped, errors};
}

// Валидация КАЖДОЙ строки — РОВНО те же правила, что и у ручного purCommit: qty>0, цена закупки и
// цена продажи — конечные числа >0. Артикул без названия (когда товара ещё нет в каталоге) и
// повторяющийся в файле артикул — тоже ошибки. НИЧЕГО не пишем в DB на этом шаге (только читаем) —
// это чистая проверка "прошло бы всё целиком или нет", чтобы гарантировать всё-или-ничего.
function parseBulkPurchaseRows(rawRows){
  const errors=[], items=[], seen=new Set();
  (rawRows||[]).forEach(row=>{
    const article=String(row['Артикул']||'').trim();
    if(!article){ errors.push({article:'—', reason:t('xlsxNoArticle')}); return; }
    if(seen.has(article.toLowerCase())){ errors.push({article, reason:t('bulkPurDupInFile')}); return; }
    seen.add(article.toLowerCase());
    const qty=+row['Количество'];
    if(!(qty>0)){ errors.push({article, reason:t('bulkPurBadQty')}); return; }
    // v26.55: цена закупки — как в файле, с дробной частью (0.4 остаётся 0.4), в валюте прихода
    const price=numIn(row['Цена закупки']);
    if(!(Number.isFinite(price)&&price>0)){ errors.push({article, reason:t('bulkPurBadPrice')}); return; }
    // необязательная готовая себестоимость единицы в сумах (если владелец посчитал её сам)
    const costUzs=numIn(row['Себестоимость, сум']);
    if(costUzs!==null&&!(Number.isFinite(costUzs)&&costUzs>0)){ errors.push({article, reason:t('bulkPurBadCost')}); return; }
    const sellPrice=numIn(row['Цена продажи']);
    if(!(Number.isFinite(sellPrice)&&sellPrice>0)){ errors.push({article, reason:t('bulkPurBadSellPrice')}); return; }
    const existingProd=DB.products.find(p=>p.article.trim().toLowerCase()===article.toLowerCase());
    let nameRu='';
    if(!existingProd){
      nameRu=String(row['Название RU']||'').trim();
      if(!nameRu){ errors.push({article, reason:t('xlsxNoName')}); return; }
    }
    items.push({article, qty, price, costUzs, sellPrice, existingProd, row, nameRu});
  });
  if(!items.length&&!errors.length) errors.push({article:'—', reason:t('nothing')});
  return {items, errors};
}
// Вызывается ТОЛЬКО когда parseBulkPurchaseRows() вернул errors.length===0 — все строки валидны.
// Новые товары создаются тем же способом, что и importPriceRows (категория по RU/UZ без учёта
// регистра, автосоздание при отсутствии) — а сам приход собирается и проводится через commitPurchase().
async function commitBulkPurchase(parsed){
  const newCats=[], newProds=[];
  const items=parsed.items.map(it=>{
    let prodObj=it.existingProd;
    if(!prodObj){
      const catText=String(it.row['Категория']||'').trim();
      let categoryId=(DB.categories[0]||{}).id;
      if(catText){
        let cat=DB.categories.concat(newCats).find(c=>(c.ru||'').trim().toLowerCase()===catText.toLowerCase()||(c.uz||'').trim().toLowerCase()===catText.toLowerCase());
        if(!cat){ cat={id:newId(), ru:catText, uz:''}; newCats.push(cat); }
        categoryId=cat.id;
      }
      const nameUz=String(it.row['Название UZ']||'').trim()||it.nameRu;
      prodObj={id:newId(),kind:'part',article:it.article,nameRu:it.nameRu,nameUz,categoryId,
        brand:String(it.row['Бренд']||'').trim(), cost:0, price:0, cur:'UZS', minStock:3,
        barcode:'20'+Math.floor(Math.random()*10000000).toString().padStart(8,'0')};
      newProds.push(prodObj);
    }
    return {kind:'part', pid:prodObj.id, article:prodObj.article, name:pname(prodObj),
      qty:it.qty, price:it.price, sellPrice:it.sellPrice, costUzs:it.costUzs!==null?it.costUzs:undefined};
  });
  await insertCatalog(newCats,newProds);
  const usd=BULKPUR.cur==='USD';
  return rpc('rpc_commit_purchase',{p:{supplierId:BULKPUR.supplierId||null,whId:BULKPUR.whId,items,
    cur:usd?'USD':'UZS', rate:usd?numIn(BULKPUR.rate):1, extraUzs:numIn(BULKPUR.extra)||0, extraNote:(BULKPUR.extraNote||'').trim()||null}});
}

/* ---- ФИЛИАЛЫ (только Владелец) ---- */
// Отдельная вкладка только для Владельца: обзор всех филиалов и их денег. Все цифры считаются
// из уже существующих данных (продажи/платежи/расходы/склад) — новых сущностей в базу не вводим.
// "Долг филиала Владельцу" — производная, а не отдельно хранимая величина, и складывается из двух
// частей по прямой просьбе Владельца: (1) себестоимость товара, который ещё не продан и физически
// лежит на складе филиала (то есть ещё не превратился в выручку), и (2) выручка (касса+карта),
// которую филиал уже собрал, но пока не отдал/не перечислил Владельцу — реальной операции "сдать
// выручку" в приложении сейчас нет, поэтому вся касса+карта "на руках" по определению и есть
// несданная выручка.
let BRQ='today', BRFROM=startOfDay(Date.now()), BRTO=Date.now();
function brRange(){
  if(BRQ==='today') return [startOfDay(Date.now()), Date.now()];
  if(BRQ==='month'){ const d=new Date(); d.setDate(1); d.setHours(0,0,0,0); return [d.getTime(), Date.now()]; }
  return [BRFROM, BRTO];
}
const branchWh=bid=>DB.warehouses.filter(w=>w.branchId===bid).map(w=>w.id);
function branchStockValue(bid){
  const whs=branchWh(bid); let v=0;
  DB.products.forEach(p=>{ whs.forEach(w=>{ v+=stockOf(p.id,w)*costOf(p); }); });
  DB.units.filter(u=>whs.includes(u.whId)&&activeUnit(u)).forEach(u=>{ v+=unitValUZS(u,'cost'); });
  return v;
}
const branchSalesAll=bid=>DB.sales.filter(s=>s.status!=='returned'&&s.branchId===bid);
function branchSalesPeriod(bid){ const [f,tt]=brRange(); return branchSalesAll(bid).filter(s=>s.at>=f&&s.at<=tt); }
// Расходы филиала сюда сознательно НЕ входят: по прямому решению Владельца расходы — это дело
// самого филиала (он отдаёт товар со скидкой именно для этого) и не уменьшают то, что филиал должен
// сдать Владельцу. Владелец ведёт свои собственные расходы отдельно, в своей же учётной книге.
function branchCash(bid){
  let cash=branchSalesAll(bid).reduce((a,s)=>a+(s.pay.cash||0),0);
  cash+=(DB.payments||[]).filter(p=>p.type==='client'&&p.method==='cash'&&p.branchId===bid).reduce((a,p)=>a+p.amount,0);
  return cash;
}
// Возврат долга картой (см. payDebt/debtCardSec) — это тоже деньги, поступившие на карту филиала,
// и они точно так же должны попасть в несданную выручку, как и обычная продажа картой — иначе эти
// деньги просто исчезают из "Расчёта" с Владельцем, хотя реально они у филиала на руках. Отклонённые
// DIMAX-NEO платежи (поддельный чек, деньги так и не пришли — см. debtPayCardNo) сюда не считаем.
const branchCard=bid=>branchSalesAll(bid).reduce((a,s)=>a+(s.pay.card||0),0)
  +(DB.payments||[]).filter(p=>p.type==='client'&&p.method==='card'&&p.branchId===bid&&p.status!=='rejected').reduce((a,p)=>a+p.amount,0);
const pendingBranch=p=>{ const s=p.saleId?DB.sales.find(x=>x.id===p.saleId):null; return s?s.branchId:((usr(p.userId)||{}).branchId||null); };
const branchAwaiting=bid=>(DB.pendings||[]).filter(p=>p.status==='waiting'&&(p.source==='leasing'||p.source==='smart')&&pendingBranch(p)===bid).reduce((a,p)=>a+p.amount,0);
const branchClientDebt=bid=>branchSalesAll(bid).reduce((a,s)=>a+(s.debtLeft||0),0);
function branchDebtors(bid){
  const byC={};
  branchSalesAll(bid).filter(s=>(s.debtLeft||0)>0).forEach(s=>{
    const c=s.clientId?cli(s.clientId):null, key=s.clientId||'—';
    byC[key]=byC[key]||{name:c?c.name:(L==='ru'?'Без клиента':'Mijozsiz'),sum:0,clientId:s.clientId||null};
    byC[key].sum+=s.debtLeft;
  });
  return Object.values(byC).sort((a,b)=>b.sum-a.sum);
}
const branchDebtGoods=bid=>branchStockValue(bid);
// Сдача выручки (DB.remits) — единственное, что уменьшает выручочную часть долга: пока сдача не
// подтверждена Владельцем (status==='confirmed'), она не в счёт — иначе менеджер мог бы просто
// "нарисовать" сдачу и обнулить долг без реальной передачи денег.
const branchRemits=(bid,status)=>(DB.remits||[]).filter(r=>r.branchId===bid&&(!status||r.status===status));
const branchRemitted=bid=>branchRemits(bid,'confirmed').reduce((a,r)=>a+r.amount,0);
const branchPendingRemit=bid=>branchRemits(bid,'pending').reduce((a,r)=>a+r.amount,0);
const branchDebtRevenue=bid=>Math.max(0, branchCash(bid)+branchCard(bid)-branchRemitted(bid));
// Сколько ещё можно отправить на сдачу прямо сейчас — общий остаток минус то, что уже отправлено
// и ждёт подтверждения Владельца (чтобы нельзя было "задвоить" сдачу, пока первая ещё не подтверждена).
const branchRemainToRemit=bid=>Math.max(0, branchDebtRevenue(bid)-branchPendingRemit(bid));
const branchDebtOwner=bid=>branchDebtGoods(bid)+branchDebtRevenue(bid);

  const app=document.getElementById('app');
  if(LOAD_CORRUPT_RAW){ app.innerHTML=screenCorruptRecovery(); return; }
  // overlays() вынесен отдельно и вызывается ОБА раза (и до входа, и после) — раньше ветка
  // "не залогинен" рисовала только стартовый экран и сразу выходила, из-за чего SHEET (окно
  // входа/установки PIN) не попадал на экран вообще: клик как будто ничего не делал, а поля
  // ввода просто не существовало в DOM.
  const overlays=()=>(SHEET?`<div class="scrim" data-act="scrim"><div class="sheet"><div class="grab"></div>${SHEET()}</div></div>`:'')

  // без ухода на другой экран), пока новый или ещё не подтвердивший продавец её не заполнит.

    case 'settlement': b=!can('allBranches')?screenSettlement():`<div class="empty">${t('noAccess')}</div>`; break;

/* ============ events ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;

  if(a==='scrim'){ if(e.target.classList.contains('scrim')){ if(EDITSALE){EDITSALE=null;PAYDOCS={};} SHEET=null;render();} return; }
  if(a==='close'){ if(EDITSALE){EDITSALE=null;PAYDOCS={};} SHEET=null; render(); return; }
  if(a==='login'){ ME=usr(id); VIEW='home'; SWH=ME.whId; render(); return; }
  if(a==='logout'){ if(SB) SB.auth.signOut(); stopRealtime(); RT=null; ME=null; CART=[]; PAYROWS=[]; DISC=0; DISCCM=''; CLID=''; PAYDOCS={}; EDITSALE=null; PUR=null; PURQ=''; SUPFROM=null; MARKETTRIED=false; CARTWHPICK=null; render(); return; }
  // ---- Единый вход (2026-09): продавцов теперь заводит только Владелец (см. screenSellers),
  // самостоятельная регистрация через Telegram убрана целиком. Одна кнопка «Войти» на стартовом
  // экране открывает форму логин+пароль; сначала проверяем её как продавца, если не подошло —
  // как пароль Владельца (см. loginSubmit). Строгий обязательный PIN Владельца (screenOwnerPinSetup)
  // сохранён как есть.
  if(a==='loginAsk'){ LOGIN_ERR=false; SHEET=sheetLoginForm; render(); return; }
  // Показать/скрыть пароль — БЕЗ render(): sheetLoginForm() пересоздаёт поле без value, и полная
  // перерисовка стёрла бы уже введённые логин/пароль. Меняем только type поля и иконку в кнопке.
  if(a==='toggleLoginPass'){
    const inp=document.getElementById('loginPass'), btn=document.getElementById('loginPassToggle');
    if(!inp||!btn) return;
    const show=inp.type==='password';
    inp.type=show?'text':'password';
    btn.innerHTML=ic(show?'eyeOff':'eye');
    return;
  }
  if(a==='loginSubmit'){
    // v26.48: вход только через Supabase Auth (email + пароль). Пароли/PIN больше нигде в приложении не хранятся.
    if(LOGGING_IN) return;
    // v26.52: одно поле «Логин» для всех. С «@» — это email, уходит в Supabase Auth как есть. Без «@» — логин:
    // Supabase Auth принимает только email, поэтому на клиенте собирается скрытый технический адрес
    // <логин>@dimax-neo.internal (тот же, что create-seller заводит при создании продавца). Ошибка при неверных
    // данных одна и та же для обоих случаев — не выдаём, существует ли учётная запись.
    const loginIn=((document.getElementById('loginUser')||{}).value||'').trim();
    const email=!loginIn?'':loginIn.includes('@')?loginIn.toLowerCase():loginIn.replace(/\s+/g,'').toLowerCase()+'@'+LOGIN_DOMAIN;
    const password=(document.getElementById('loginPass')||{}).value||'';
    if(!email||!password){ LOGIN_ERR=true; render(); return; }
    LOGGING_IN=true; LOGIN_ERR=false; render();
    SB.auth.signInWithPassword({email,password}).then(async({data,error})=>{
      if(error){ LOGGING_IN=false; if(error.status===400||error.status===422||/invalid login|invalid_credentials|Email not confirmed|validate email|invalid format/i.test(error.message||'')){ LOGIN_ERR=true; render(); } else { render(); toastErr(error); } return; }
      try{ const ok=await enterApp(data.session); LOGGING_IN=false; if(ok){ SHEET=null; LOGIN_ERR=false; } render(); }
      catch(e){ LOGGING_IN=false; render(); toastErr(e); }
    });
    return; }
  // ---- Продавцы: заводит только Владелец (2026-09) ----
  if(a==='sellerNewAsk'){ if(!can('settings')) return; SELLEREDIT=null; SELLERFORM={hasPoint:true}; SHEET=sheetSellerForm; render(); return; }
  if(a==='sellerEditAsk'){ if(!can('settings')) return; const u=usr(id); if(!u) return;
    SELLEREDIT=id; SELLERFORM={hasPoint:!!u.hasPoint}; SHEET=sheetSellerForm; render(); return; }
  if(a==='sellerSetStatus'){ if(!SELLERFORM) return; captureSellerDraft(); SELLERFORM.hasPoint=(el.dataset.v==='point'); render(); return; }
  if(a==='sellerSaveDo'){ if(!can('settings')) return;
    const g=id=>((document.getElementById(id)||{}).value||'').trim();
    const name=g('selName');
    const branchId=(document.getElementById('selBranch')||{}).value||(DB.branches[0]||{}).id||'';
    const login=g('selLogin');
    const password=(document.getElementById('selPass')||{}).value||'';
    // v26.52: логин — не email (технический адрес для Supabase Auth собирает create-seller); формат проверяется здесь
    // и ещё раз на сервере, занятость логина (без учёта регистра) — на сервере. Пароль при правке — только если введён новый.
    const hasPoint=!!(SELLERFORM&&SELLERFORM.hasPoint);
    const code=g('selCode').toUpperCase();
    // Паспорт/адрес/телефон обычно заполняет сам продавец в своей анкете (см. screenSellerOnboarding),
    // но Владелец может поправить опечатку отсюда же. Согласие с «Условиями сотрудничества» юридически
    // привязано к КОНКРЕТНЫМ данным — если Владелец меняет что-то из этого списка у уже подтвердившего
    // анкету продавца, сбрасываем profileComplete, чтобы он подтвердил заново при следующем входе
    // (по прямому решению Владельца, 2026-09). Смена филиала/статуса/логина/пароля на это не влияет —
    // это операционные настройки, а не персональные данные из анкеты.
    const passSeries=g('selPassSeries').toUpperCase(), passNumber=g('selPassNumber');
    const region=g('selRegion'), district=g('selDistrict'), mfy=g('selMfy'), street=g('selStreet');
    const phoneDigits=g('selPhone'), phone2Digits=g('selPhone2');
    const onbVals={name, passportSeries:passSeries, passportNumber:passNumber,
      addrRegion:region, addrDistrict:district, addrMfy:mfy, addrStreet:street,
      phone:phoneDigits?('+998'+phoneDigits):'', phone2:phone2Digits?('+998'+phone2Digits):''};
    if(BUSY) return;
    const finish=()=>{ BUSY=false; SHEET=null; SELLEREDIT=null; SELLERFORM=null; refresh(['users','user_directory']).then(()=>toast(t('saved'))); };
    if(SELLEREDIT){
      const u=usr(SELLEREDIT); if(!u) return;
      const tmp={whId:u.whId,priorWhId:u.priorWhId};
      const whId=resolveSellerWhId(tmp, hasPoint, branchId);
      const onbKeys=Object.keys(onbVals);
      const changed=onbKeys.some(k=>(u[k]||'')!==(onbVals[k]||''));
      const upd={branch_id:branchId,wh_id:whId,prior_wh_id:tmp.priorWhId||null,has_point:hasPoint,code:code||null,name:onbVals.name,
        passport_series:onbVals.passportSeries,passport_number:onbVals.passportNumber,addr_region:onbVals.addrRegion,addr_district:onbVals.addrDistrict,
        addr_mfy:onbVals.addrMfy,addr_street:onbVals.addrStreet,phone:onbVals.phone,phone2:onbVals.phone2};
      if(changed&&u.profileComplete){ upd.profile_complete=false; upd.agreed_at=null; toast(t('onbResetNotice')); }
      BUSY=true;
      dbw(SB.from('users').update(upd).eq('id',u.id),false).then(({error})=>{ if(error){ BUSY=false; return; }
        if(!password){ finish(); return; }
        SB.functions.invoke('manage-seller',{body:{action:'set_password',user_id:u.id,password}}).then(({data,error:e2})=>{
          if(e2||!data||!data.ok){ BUSY=false; fnErr(e2,data); return; } finish(); }); });
    } else {
      if(!login||!password){ toast(t('sellerNeedFields')); return; }
      if(!LOGIN_RE.test(login)){ captureSellerDraft(); toast('⚠ '+t('sellerLoginFmt')); return; }
      const body={login,password,name,code:code||null,has_point:hasPoint};
      if(hasPoint){
        if(SELLERFORM&&SELLERFORM.newBranch){ const nb=((document.getElementById('selNewBranch')||{}).value||'').trim(); if(!nb){ toast(t('needBranchName')); return; } body.new_branch_name=nb; }
        else body.branch_id=branchId;
      }
      BUSY=true;
      SB.functions.invoke('create-seller',{body}).then(({data,error})=>{ if(error||!data||!data.ok){ BUSY=false; fnErr(error,data); return; }
        BUSY=false; SHEET=null; SELLEREDIT=null; SELLERFORM=null;
        refresh(['users','user_directory','branches','warehouses']).then(()=>toast(data.message||t('saved'))); });
    }
    return; }
  if(a==='onbSubmitDo'){
    const g=id=>((document.getElementById(id)||{}).value||'').trim();
    const name=g('onbName');
    const passSeries=g('onbPassSeries'), passNumber=g('onbPassNumber');
    const region=g('onbRegion'), district=g('onbDistrict'), mfy=g('onbMfy'), street=g('onbStreet');
    const phoneDigits=g('onbPhone'), phone2Digits=g('onbPhone2');
    const consent=!!(document.getElementById('onbConsent')||{}).checked;
    // v26.50: при незаполненных полях НИЧЕГО не стираем — подсвечиваем, пишем сколько не заполнено, ведём к первому.

function collectDocs(m){
  const d=PAYDOCS[m]||(PAYDOCS[m]={});
  document.querySelectorAll('[data-d]').forEach(i=>{ d[i.dataset.d]=i.value; });
  return d;
}
// Паспорт/ПИНФЛ/адрес покупателя, однажды введённые при оформлении Smart Market/лизинга/продажи в долг,
// сохраняются в карточку клиента (только пустые поля, чужие данные не затираем) — чтобы при повторной
// покупке того же клиента эти бланки заполнялись сами (см. пред-заполнение выше в docOpen).
function syncBuyerToClient(m){
  if(m!=='smart'&&m!=='leasing'&&m!=='debt') return;
  const d=PAYDOCS[m]; if(!d) return;
  const clientId=EDITSALE?((DB.sales.find(x=>x.id===EDITSALE)||{}).clientId):CLID;
  if(!clientId) return;
  const c=cli(clientId); if(!c) return;
  const upd={};
  if(!c.phone&&d.bPhone) upd.phone=d.bPhone;
  if(!c.passport&&d.bPassport) upd.passport=d.bPassport;
  if(!c.pinfl&&d.bPinfl) upd.pinfl=d.bPinfl;
  if(!c.address&&d.bAddr) upd.address=d.bAddr;
  if(Object.keys(upd).length) dbw(SB.from('clients').update(upd).eq('id',c.id),['clients'],false);
}

document.addEventListener('input',e=>{

    onbDraft()[e.target.id]=e.target.type==='checkbox'?e.target.checked:e.target.value; onbSaveSoon(); return; }

  if(e.target.id==='skq'){ SKQ=e.target.value; const p=e.target.selectionStart; render();

    const n=document.getElementById('clq'); if(n){n.focus();n.setSelectionRange(p,p);} return; }
  if(e.target.dataset.nf!==undefined){ NEWCL[e.target.dataset.nf]=e.target.value; return; }
  // Сумму возврата долга держим в DEBTPAY.amount, а не только в самом поле ввода — иначе следующий
  // render() (переключение наличные/карта, загрузка фото чека) перерисует поле со значением c.debt
  // и введённая частичная сумма потеряется (см. комментарий у объявления DEBTPAY).
  if(e.target.id==='paysum'){ DEBTPAY.amount=+e.target.value||0; return; }
  if(e.target.dataset.act==='qset'){ const i=CART.find(x=>x.key===e.target.dataset.id&&x.kind==='part');
    if(i){
      const raw=+e.target.value;
      let q=Number.isFinite(raw)?Math.max(0,raw):0;
      const have=stockOf(i.pid,i.whId||saleWh());
      // Запоминаем реально введённое продавцом число (сколько клиент хочет в сумме), чтобы кнопка
      // "докупить с другого склада" сразу предложила недостающий остаток одним нажатием, а не по 1 шт
      // (см. cartAddFrom). Если ввод помещается на своём складе — сбрасываем, "недостающего" больше нет.
      if(q>have && !DB.settings.allowNegative){ i.wantExtra=raw-have; q=have; toast(t('notEnough')+' ('+have+')'); }
      else { i.wantExtra=undefined; }
      i.qty=q; i.sum=i.price*i.qty;
      // Ввод "0" в поле количества должен убирать позицию из корзины, а не оставлять "нулевую" строку —
      // иначе такая строка могла попасть в проведённую продажу как пустая (qty=0) позиция.
      if(i.qty<=0){
        CART=CART.filter(x=>x!==i);
        if(!CART.length){ SHEET=null; PAYROWS=[]; DISC=0; DISCCM=''; CLID=''; PAYDOCS={}; } else syncCashToTotal();
        render(); return;
      }
      // "Наличные" должны сразу подхватить новый итог при изменении количества прямо в поле корзины —
      // иначе, как и при добавлении строки, оплата перестаёт сходиться с итогом (см. syncCashToTotal).
      syncCashToTotal();
      const cashIdx=PAYROWS.findIndex(r=>r.m==='cash');
      if(cashIdx!==-1){ const cashInput=document.querySelector(`input.payrow[data-i="${cashIdx}"]`);
        if(cashInput&&cashInput!==e.target){ cashInput.value=PAYROWS[cashIdx].amount;
          cashInput.style.borderColor=PAYROWS[cashIdx].amount===0?'var(--warn)':''; } }
      const sub=CART.reduce((a,x)=>a+x.price*x.qty,0), tot=sub-DISC;
      const paid=PAYROWS.reduce((a,r)=>a+(+r.amount||0),0);
      const ct=document.getElementById('ctotal'); if(ct) ct.textContent=fmt(tot);
      const cr=document.getElementById('crest'); if(cr){cr.textContent=fmt(tot-paid);cr.style.color=(tot-paid)===0?'var(--accent)':'var(--warn)';}
    }
    return; }
  if(e.target.dataset.p!==undefined&&PUR){ const k=e.target.dataset.p;
    PUR[k]=e.target.value; render();
    return; }
  if(e.target.dataset.bp!==undefined&&BULKPUR){ BULKPUR[e.target.dataset.bp]=e.target.value; render(); return; }
  if(e.target.dataset.pe!==undefined&&PUR_EDIT){ PUR_EDIT[e.target.dataset.pe]=e.target.value; render(); return; }
  if(e.target.dataset.pei!==undefined&&PUR_EDIT){ const ix=e.target.dataset.pei, f=e.target.dataset.pef;
    PUR_EDIT.items[+ix][f]=e.target.value.replace(',','.');
    const pos=e.target.selectionStart;
    render();
    const n=document.querySelector('input[data-pei="'+ix+'"][data-pef="'+f+'"]');
    if(n){ n.focus(); n.setSelectionRange(pos,pos); }
    return; }
  if(e.target.dataset.sn!==undefined&&PUR){ const i=PUR.items[+e.target.dataset.pi];
    if(i){ i.serials=i.serials||[]; i.serials[+e.target.dataset.sn]=e.target.value; } return; }
  if(e.target.dataset.pi!==undefined&&PUR){ const i=PUR.items[+e.target.dataset.pi];
    if(i){
      const pi=e.target.dataset.pi, f2=e.target.dataset.f2;
      i[f2]=f2==='serial'?e.target.value:e.target.value.replace(',','.');
      // Ручная правка поля "Цена продажи" помечает позицию как sellPriceTouched — после этого
      // sheetPurchase() перестаёт перезаписывать её автоматической подсказкой (см. purSellHint).
      if(f2==='sellPrice') i.sellPriceTouched=true;
      // Без render() тут сумма строки ("=") и "Итого партии" молча не обновлялись на экране,
      // хотя число в PUR.items уже менялось — пользователь видел застывший "0" при вводе qty/price.
      // Курсор восстанавливаем тем же приёмом, что и в полях поиска (sq/gq/purq и т.п.).
      const pos=e.target.selectionStart;
      render();
      const n=document.querySelector('input[data-pi="'+pi+'"][data-f2="'+f2+'"]');
      if(n){ n.focus(); n.setSelectionRange(pos,pos); }
    }
    return; }
  if(e.target.id==='purq'){ PURQ=e.target.value; const p2=e.target.selectionStart; render();
    const nn=document.getElementById('purq'); if(nn){nn.focus();nn.setSelectionRange(p2,p2);} return; }
  if(e.target.id==='priceQ'){ PRICE_Q=e.target.value; const p3=e.target.selectionStart; render();
    const nq=document.getElementById('priceQ'); if(nq){nq.focus();nq.setSelectionRange(p3,p3);} return; }
  if(e.target.id==='wipeConfirmInput'){ WIPE_TEXT=e.target.value; const p4=e.target.selectionStart; render();
    const nw=document.getElementById('wipeConfirmInput'); if(nw){nw.focus();nw.setSelectionRange(p4,p4);} return; }
  if(e.target.dataset.uc!==undefined){ const u=usr(e.target.dataset.uc);
    if(u){ dbw(SB.from('users').update({code:e.target.value.trim().toUpperCase()||null}).eq('id',u.id),['users','user_directory']); } return; }
  if(e.target.dataset.s!==undefined){ saveSettings({[e.target.dataset.s]:e.target.value.trim()}); return; }
  if(e.target.dataset.f!==undefined){ DOCF[e.target.dataset.f]=e.target.value; return; }
  if(e.target.dataset.q!==undefined){ DOCITEMS[+e.target.dataset.q].qty=Math.max(1,+(e.target.value||1)); return; }
  if(e.target.id==='docq'){ DOCQ=e.target.value; const p=e.target.selectionStart; render();
    const nn=document.getElementById('docq'); if(nn){nn.focus();nn.setSelectionRange(p,p);} return; }
  if(e.target.id==='discCm'){ DISCCM=e.target.value; return; }
  if(e.target.classList.contains('payrow')||e.target.id==='disc'){
    let editedIdx=-1;
    if(e.target.id==='disc'){
      const subtotal0=CART.reduce((a,x)=>a+x.price*x.qty,0);
      const rawD=+e.target.value;
      DISC=Number.isFinite(rawD)?Math.min(Math.max(rawD,0),subtotal0):0;
      const ds=document.getElementById('discStar'); if(ds) ds.style.display=DISC>0?'':'none';
    }
    else if(e.target.id!=='discCm'){
      editedIdx=+e.target.dataset.i;
      const rawP=+e.target.value;
      PAYROWS[editedIdx].amount=Number.isFinite(rawP)?Math.max(0,rawP):0;
    }
    // авто-баланс: "Наличные" всегда принимают остаток, чтобы сумма способов оплаты сходилась с итогом —
    // срабатывает и когда меняют другой способ оплаты, и когда меняют скидку (итог тоже меняется)
    const cashIdx=PAYROWS.findIndex(r=>r.m==='cash');
    let anchorIdx=-1;
    if(cashIdx!==-1){
      if(editedIdx===cashIdx){ for(let k=PAYROWS.length-1;k>=0;k--){ if(k!==editedIdx){ anchorIdx=k; break; } } }
      else anchorIdx=cashIdx;
    }
    if(anchorIdx!==-1){
      const sub0=CART.reduce((a,x)=>a+x.price*x.qty,0), tot0=sub0-DISC;
      const restSum=PAYROWS.reduce((a,r,k)=>k===anchorIdx?a:a+(+r.amount||0),0);
      PAYROWS[anchorIdx].amount=Math.max(0,tot0-restSum);
      const anchorInput=document.querySelector(`input.payrow[data-i="${anchorIdx}"]`);
      if(anchorInput){ anchorInput.value=PAYROWS[anchorIdx].amount;
        anchorInput.style.borderColor=PAYROWS[anchorIdx].amount===0?'var(--warn)':''; }
    }
    if(editedIdx!==-1&&e.target.style) e.target.style.borderColor=(+e.target.value||0)===0?'var(--warn)':'';
    const sub=CART.reduce((a,i)=>a+i.price*i.qty,0), tot=sub-DISC;
    const paid=PAYROWS.reduce((a,r)=>a+(+r.amount||0),0);
    const ct=document.getElementById('ctotal'); if(ct) ct.textContent=fmt(tot);
    const cr=document.getElementById('crest'); if(cr){cr.textContent=fmt(tot-paid);cr.style.color=(tot-paid)===0?'var(--accent)':'var(--warn)';}
  }
});
// Сводка по ценам: Enter в поле цены/наценки сохраняет так же, как потеря фокуса — не отдельная
// логика сохранения, а просто заставляем поле "потерять фокус", что уже обрабатывается выше (change).
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.dataset&&e.target.dataset.pp!==undefined){
    e.preventDefault(); e.target.blur();
  }
});

boot();

<script>
// v26.61: просмотр фото товара/техники на весь экран. Нажатие на миниатюру с фото ([data-zoom]) открывает фото
// поверх приложения; сама строка при этом не срабатывает (нажатие на название/цену — как раньше).
// Приближение: двумя пальцами или двойным нажатием; при увеличении — перетаскивание. Закрыть: крестик, нажатие
// по фону, свайп вниз, Esc или системная кнопка «Назад» (v26.59).
(function(){
  var pv=null, img=null, sc=1, tx=0, ty=0, pts={}, startDist=0, startSc=1, startTx=0, startTy=0, panStart=null, lastTap=0, dragY=0, moved=false;
  function apply(){ if(!img) return; img.style.transform='translate('+tx+'px,'+(ty+dragY)+'px) scale('+sc+')';
    pv.style.background='rgba(0,0,0,'+(0.94*Math.max(0.35,1-Math.abs(dragY)/400))+')'; }
  function clamp(){ if(sc<=1){ sc=1; tx=0; ty=0; return; } if(sc>5) sc=5;
    var mx=Math.max(0,(img.offsetWidth*sc-innerWidth)/2), my=Math.max(0,(img.offsetHeight*sc-innerHeight)/2);
    tx=Math.max(-mx,Math.min(mx,tx)); ty=Math.max(-my,Math.min(my,ty)); }
  function close(){ if(!pv) return false; var el=pv; pv=null; img=null; document.body.style.overflow='';
    el.classList.remove('on'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },180); return true; }
  window.__closePhotoViewer=close;
  window.__photoViewerOpen=function(){ return !!pv; };
  function open(src,cap){ close(); sc=1; tx=0; ty=0; dragY=0; pts={};
    pv=document.createElement('div'); pv.id='pv'; pv.setAttribute('role','dialog'); pv.setAttribute('aria-modal','true');
    pv.innerHTML='<img alt=""><button type="button" class="pv-x" aria-label="×"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>'+(cap?'<div class="pv-cap"></div>':'');
    img=pv.querySelector('img'); img.src=src; if(cap) pv.querySelector('.pv-cap').textContent=cap;
    document.body.appendChild(pv); document.body.style.overflow='hidden'; requestAnimationFrame(function(){ if(pv) pv.classList.add('on'); });
    pv.querySelector('.pv-x').addEventListener('click',function(e){ e.stopPropagation(); close(); });
    pv.addEventListener('pointerdown',down); pv.addEventListener('pointermove',move); pv.addEventListener('pointerup',up); pv.addEventListener('pointercancel',up); }
  function dist(){ var k=Object.keys(pts); if(k.length<2) return 0; var a=pts[k[0]],b=pts[k[1]]; return Math.hypot(a.x-b.x,a.y-b.y); }
  function down(e){ if(e.target.closest('.pv-x')) return; pts[e.pointerId]={x:e.clientX,y:e.clientY}; moved=false; pv.classList.add('drag');
    if(Object.keys(pts).length===2){ startDist=dist(); startSc=sc; panStart=null; }
    else { panStart={x:e.clientX,y:e.clientY}; startTx=tx; startTy=ty; } }
  function move(e){ if(!pts[e.pointerId]) return; pts[e.pointerId]={x:e.clientX,y:e.clientY};
    var n=Object.keys(pts).length;
    if(n===2&&startDist){ sc=Math.max(1,Math.min(5,startSc*dist()/startDist)); moved=true; apply(); return; }
    if(n===1&&panStart){ var dx=e.clientX-panStart.x, dy=e.clientY-panStart.y; if(Math.abs(dx)+Math.abs(dy)>6) moved=true;
      if(sc>1){ tx=startTx+dx; ty=startTy+dy; clamp(); } else { dragY=dy>0?dy:dy/3; } apply(); } }
  function up(e){ var wasTap=!moved&&Object.keys(pts).length===1; delete pts[e.pointerId]; if(!pv) return;
    if(Object.keys(pts).length===0){ pv.classList.remove('drag');
      if(sc===1&&dragY>110){ close(); return; }
      dragY=0; clamp(); apply();
      if(wasTap){ var now=Date.now();
        if(now-lastTap<300){ lastTap=0; if(sc>1){ sc=1; tx=0; ty=0; } else { sc=2.5; tx=(innerWidth/2-e.clientX)*1.5; ty=(innerHeight/2-e.clientY)*1.5; clamp(); } apply(); }
        else { lastTap=now; if(e.target===pv&&sc===1) setTimeout(function(){ if(lastTap===now&&pv) close(); },300); } } }
    else if(Object.keys(pts).length===1){ var k=Object.keys(pts)[0]; panStart={x:pts[k].x,y:pts[k].y}; startTx=tx; startTy=ty; startDist=0; } }
  // фаза перехвата: нажатие на фото открывает просмотр и не доходит до общего обработчика data-act строки
  document.addEventListener('click',function(e){ var z=e.target.closest&&e.target.closest('[data-zoom]'); if(!z||!z.dataset.zoom) return;
    e.preventDefault(); e.stopPropagation(); open(z.dataset.zoom,z.dataset.zoomCap||''); },true);
  // фото внутри неактивной строки (например, модель техники без остатка — кнопка disabled): браузер не присылает
  // click для disabled-кнопок, поэтому открываем просмотр по отпусканию пальца; сама строка остаётся неактивной
  var dz=null;
  document.addEventListener('pointerdown',function(e){ var z=e.target.closest&&e.target.closest('[data-zoom]'); dz=(z&&z.closest('button[disabled]'))?{z:z,x:e.clientX,y:e.clientY}:null; },true);
  document.addEventListener('pointerup',function(e){ if(!dz) return; var d=dz; dz=null;
    if(Math.abs(e.clientX-d.x)+Math.abs(e.clientY-d.y)<10&&d.z.contains(e.target)) open(d.z.dataset.zoom,d.z.dataset.zoomCap||''); },true);
  document.addEventListener('keydown',function(e){ if(pv&&e.key==='Escape') close(); });
  // v26.62: у продавцов долгое нажатие на фото не открывает меню «Скачать / Скопировать / Поделиться / Открыть в Chrome»
  function noSave(e){ if(typeof ME==='undefined'||!ME||ME.role==='admin') return;
    if(e.target.closest&&e.target.closest('img,.tile,#pv,[data-zoom]')){ e.preventDefault(); } }
  document.addEventListener('contextmenu',noSave,true); document.addEventListener('dragstart',noSave,true);
  // временные ссылки на фото: обновить заранее, если приложение открыто долго (проверка раз в 20 минут)
  setInterval(function(){ if(typeof ME==='undefined'||!ME||typeof RAW==='undefined') return;
    var ks=(RAW.products||[]).map(function(r){ return ppKey(r.photo_path); }).filter(Boolean);
    if(!ks.some(function(k){ return photoStale('pp:'+k); })) return;
    signPhotos([],ks).then(function(){ buildDB(); if(typing()) RT_DIRTY=true; else render(); }); },20*60*1000);
})();
</script>
<script>
// v26.59: системная кнопка / жест «Назад» (Android, установленное приложение и обычная вкладка Chrome).
// Маршрутизации в приложении нет — экран задают VIEW и SHEET. Чтобы «Назад» не закрывал приложение сразу, над
// базовой записью истории держим одну служебную запись (guard). Нажатие «Назад» снимает её (popstate), мы делаем
// один шаг внутри приложения и кладём guard обратно. Порядок:
//   1) открыто окно с шагом назад в заголовке (clBack, docBack2, purBack, …) — нажимаем эту же кнопку;
//   2) открыто окно без шага назад — тот же обработчик, что у крестика (data-act="close");
//   3) не «Главная» — тот же обработчик, что у вкладки «Главная» (data-act="go", data-v="home");
//   4) «Главная» / вход / обязательная анкета продавца — подсказка «Нажмите «Назад» ещё раз…»; guard не кладём
//      2 секунды, так что второе нажатие обрабатывает уже сам браузер/Android (выход). Через 2 с guard возвращается.
// Анкету продавца «Назад» никогда не закрывает. Новых обработчиков действий нет — нажимаются существующие кнопки.
// Chrome не даёт странице «перехватывать» «Назад» до первого касания пользователя, поэтому guard кладётся с первого
// касания/нажатия клавиши (до этого «Назад» ведёт себя как раньше).
(function(){
  if(!window.history||!history.pushState) return;
  var guard=false, interacted=false, exitArmed=false, exitT=null;
  function pushGuard(){ if(guard||!interacted||exitArmed) return;
    try{ history.pushState({dimaxGuard:1},''); guard=true; }catch(e){} }
  function onUser(){
    if(!interacted){ interacted=true; try{ if(!(history.state&&history.state.dimaxGuard)) history.replaceState({dimaxBase:1},''); }catch(e){} }
    if(exitArmed){ exitArmed=false; clearTimeout(exitT); } // пользователь продолжил работу — выход не ждём
    pushGuard(); }
  ['pointerdown','touchstart','keydown'].forEach(function(ev){ document.addEventListener(ev,onUser,{capture:true,passive:true}); });
  function pressAct(act,v){ // тот же путь, что и обычное нажатие: общий обработчик кликов по data-act
    var b=document.createElement('button'); b.type='button'; b.dataset.act=act; if(v) b.dataset.v=v;
    b.style.display='none'; document.body.appendChild(b); b.click(); b.remove(); }
  window.addEventListener('popstate',function(e){
    if(e.state&&e.state.dimaxGuard){ guard=true; return; } // «Вперёд» обратно на нашу служебную запись
    guard=false;
    if(window.__closePhotoViewer&&window.__closePhotoViewer()){ pushGuard(); return; } // v26.61: сначала закрыть просмотр фото
    var onboarding=typeof ME!=='undefined'&&ME&&ME.role==='manager'&&!ME.profileComplete;
    if(!onboarding&&SHEET){
      var sh=document.querySelector('.scrim .sheet');
      var back=sh&&sh.querySelector('.sheet-hd [data-act$="Back"], .sheet-hd [data-act="docBackToSale"]');
      if(back) back.click(); else pressAct('close');
      pushGuard(); return; }
    if(!onboarding&&ME&&VIEW!=='home'){ pressAct('go','home'); pushGuard(); return; }
    exitArmed=true; toast(t('backAgainExit'));
    clearTimeout(exitT); exitT=setTimeout(function(){ exitArmed=false; pushGuard(); },2000);
  });
})();
</script>
<script>
// v26.53 PWA: service worker кэширует только оболочку (HTML, manifest, иконки, шрифты/библиотеку с CDN).
// Supabase (*.supabase.co) он не перехватывает вообще — данные всегда живые. Логику приложения не трогает.
// Обновление: браузер сверяет sw.js с сервером при каждом открытии (updateViaCache:'none' — мимо HTTP-кэша) и при
// возврате в приложение; новая версия sw.js (новый VERSION) ставит новый кэш, удаляет старый и берёт управление.
// Чтобы не потерять то, что продавец сейчас вводит, страница перезагружается на новую версию не сразу, а когда
// приложение снова открыто и ничего не заполняется (нет открытого окна, пустая корзина, не идёт ввод).
(function(){
  if(!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  let updated=false;
  const hadController=!!navigator.serviceWorker.controller;
  const idle=()=>{ try{ return !SHEET && !(CART&&CART.length) && !typing(); }catch(e){ return true; } };
  const maybeReload=()=>{ if(updated && document.visibilityState==='visible' && idle()){ updated=false; location.reload(); } };
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadController){ updated=true; maybeReload(); } });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{scope:'./',updateViaCache:'none'}).then(reg=>{
      document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ reg.update().catch(()=>{}); maybeReload(); } });
    }).catch(e=>console.warn('[DIMAX] service worker',e));
  });
})();
</script>
